const GH = {cfg:{}, timer:null, busy:false, status:''};
try { GH.cfg = JSON.parse(localStorage.getItem('jk-gh') || '{}') || {}; } catch(e){ GH.cfg = {}; }
const ghReady = () => isStandalone() && !!(GH.cfg.repo && GH.cfg.token);
function ghStore(){ try { localStorage.setItem('jk-gh', JSON.stringify(GH.cfg)); } catch(e){} }
function ghErrText(e){
  const s = e && e.status;
  if (e && e.code === 'conflict') return '다른 기기에서 GitHub에 새로 저장한 기록이 있어요.';
  if (e && e.code === 'nodata') return '이 저장소에는 아직 저장된 기록이 없어요.';
  if (s === 401) return '토큰이 맞지 않거나 만료됐어요. 토큰을 다시 만들어 넣어 주세요.';
  if (s === 403) return '토큰에 이 저장소 Contents 쓰기 권한이 없어요. 토큰 설정을 확인해 주세요.';
  if (s === 404) return '저장소를 찾지 못했어요. 이름(아이디/저장소)과 토큰 권한을 확인해 주세요.';
  if (s === 422) return 'GitHub가 요청을 받지 않았어요. 잠시 후 다시 시도해 주세요.';
  if (e && e.name === 'TypeError') return 'GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  return 'GitHub 작업을 끝내지 못했어요. 잠시 후 다시 시도해 주세요.';
}
async function gh(path, opts={}){
  const res = await fetch(`https://api.github.com/repos/${GH.cfg.repo}${path}`, {
    method: opts.method || 'GET', cache:'no-store',
    headers: {'Authorization':'Bearer ' + GH.cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opts.body ? {'Content-Type':'application/json'} : {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok){ const err = new Error('github'); err.status = res.status; try { err.msg = (await res.json()).message; } catch(x){} throw err; }
  return res.status === 204 ? null : res.json();
}
const ghBranch = () => GH.cfg.branch || 'main';
async function ghHead(){
  try { return (await gh(`/git/ref/heads/${encodeURIComponent(ghBranch())}`)).object.sha; }
  catch(e){ if (e.status === 404 || e.status === 409) return null; throw e; }
}
function blobToB64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); }); }
function b64ToBytes(s){ const bin = atob(String(s || '').replace(/\s/g, '')); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
const EXT_TYPE = {png:'image/png', jpg:'image/jpeg', gif:'image/gif', webp:'image/webp', pdf:'application/pdf', svg:'image/svg+xml', woff2:'font/woff2', woff:'font/woff', ttf:'font/ttf', otf:'font/otf'};
const TYPE_EXT = Object.fromEntries(Object.entries(EXT_TYPE).map(([k, v]) => [v, k]));
function ghSetStatus(s){ GH.status = s; renderTop(); }
function ghMark(){
  if (!ghReady()) return;
  GH.cfg.dirty = true; ghStore(); ghSetStatus('dirty');
  if (GH.cfg.auto){ clearTimeout(GH.timer); GH.timer = setTimeout(() => ghSave({auto:true}).catch(() => {}), 15000); }
}
async function ghSave({force=false, auto=false, progress}={}){
  if (!ghReady() || GH.busy) return;
  GH.busy = true; clearTimeout(GH.timer); ghSetStatus('saving');
  const say = (t) => { if (progress) progress(t); };
  try {
    let head = await ghHead();
    if (!head){
      say('저장소를 준비하는 중…');
      const readme = '# Pair Archive 기록\n\nPair Archive가 저장한 기록이에요. data 폴더를 직접 고치지 말아 주세요.\n';
      await gh('/contents/README.md', {method:'PUT', body:{message:'Pair Archive 기록 저장소 시작', content: btoa(unescape(encodeURIComponent(readme))), branch: ghBranch()}});
      head = await ghHead();
    }
    if (!force && GH.cfg.lastCommit && head !== GH.cfg.lastCommit){
      const c = await gh(`/compare/${GH.cfg.lastCommit}...${head}`).catch(() => null);
      const touched = !c || (c.files || []).some(f => f.filename.startsWith('data/'));
      if (touched){ const err = new Error('conflict'); err.code = 'conflict'; throw err; }
    }
    const commit = await gh(`/git/commits/${head}`);
    const tree = await gh(`/git/trees/${commit.tree.sha}?recursive=1`);
    const remote = new Map((tree.tree || []).filter(t => t.type === 'blob' && t.path.startsWith('data/assets/')).map(t => [t.path, t.sha]));
    const refs = [...collectRefs({p:S.pairs, i:S.items, s:S.site})];
    const entries = [], want = new Set(), files = {};
    let n = 0;
    for (const ref of refs){
      n++; const blob = await localBlob(ref); if (!blob) continue;
      const path = `data/assets/${ref}.${TYPE_EXT[blob.type] || 'bin'}`;
      files[ref] = path; want.add(path);
      if (!remote.has(path)){
        say(`사진과 파일 올리는 중 ${n}/${refs.length}`);
        const r = await gh('/git/blobs', {method:'POST', body:{content: await blobToB64(blob), encoding:'base64'}});
        entries.push({path, mode:'100644', type:'blob', sha:r.sha});
      }
    }
    for (const path of remote.keys()) if (!want.has(path)) entries.push({path, mode:'100644', type:'blob', sha:null});
    say('기록 저장하는 중…');
    const data = {app:'pair-archive', version:2, savedAt:new Date().toISOString(), site:S.site, pairs:S.pairs, items:S.items, bodies:S.bodies, files};
    const db = await gh('/git/blobs', {method:'POST', body:{content: JSON.stringify(data), encoding:'utf-8'}});
    entries.push({path:'data/data.json', mode:'100644', type:'blob', sha:db.sha});
    const nt = await gh('/git/trees', {method:'POST', body:{base_tree: commit.tree.sha, tree: entries}});
    const when = new Date();
    const nc = await gh('/git/commits', {method:'POST', body:{message:`기록 저장 · ${when.getFullYear()}-${pad(when.getMonth() + 1)}-${pad(when.getDate())} ${pad(when.getHours())}:${pad(when.getMinutes())}`, tree: nt.sha, parents:[head]}});
    await gh(`/git/refs/heads/${encodeURIComponent(ghBranch())}`, {method:'PATCH', body:{sha: nc.sha}});
    GH.cfg.lastCommit = nc.sha; GH.cfg.lastSavedAt = when.toISOString(); GH.cfg.dirty = false; ghStore();
    S.ghNote = null; GH.busy = false; ghSetStatus('saved'); renderNote();
    if (!auto) toast('GitHub에 저장했어요.');
  } catch(e){
    GH.busy = false; ghSetStatus('error');
    if (e.code === 'conflict'){ S.ghNote = {kind:'conflict'}; renderNote(); window.scrollTo({top:0, behavior:'smooth'}); if (!auto) toast(ghErrText(e)); }
    else if (!auto) toast(ghErrText(e));
    throw e;
  }
}
async function ghLoad({progress}={}){
  if (!ghReady() || GH.busy) return;
  GH.busy = true; ghSetStatus('loading');
  const say = (t) => { if (progress) progress(t); };
  try {
    const head = await ghHead(); if (!head){ const err = new Error('nodata'); err.code = 'nodata'; throw err; }
    const commit = await gh(`/git/commits/${head}`);
    const tree = await gh(`/git/trees/${commit.tree.sha}?recursive=1`);
    const byPath = new Map((tree.tree || []).map(t => [t.path, t.sha]));
    if (!byPath.has('data/data.json')){ const err = new Error('nodata'); err.code = 'nodata'; throw err; }
    say('기록 받는 중…');
    const raw = await gh(`/git/blobs/${byPath.get('data/data.json')}`);
    const data = JSON.parse(new TextDecoder().decode(b64ToBytes(raw.content)));
    const list = Object.entries(data.files || {}); let n = 0;
    for (const [ref, path] of list){
      n++; if (LOCAL_URLS[ref] || !byPath.has(path)) continue;
      say(`사진과 파일 받는 중 ${n}/${list.length}`);
      const b = await gh(`/git/blobs/${byPath.get(path)}`);
      const blob = new Blob([b64ToBytes(b.content)], {type: EXT_TYPE[path.split('.').pop()] || 'application/octet-stream'});
      if (IDB.db) await idbDo('files', 'readwrite', s => s.put(blob, ref));
      LOCAL_URLS[ref] = URL.createObjectURL(blob);
    }
    S.pairs = data.pairs || {}; S.items = data.items || {}; S.bodies = data.bodies || {}; S.site = {...DEFAULT_SITE, ...(data.site || {})};
    saveLocal();
    GH.cfg.lastCommit = head; GH.cfg.dirty = false; ghStore();
    S.ghNote = null; GH.busy = false; ghSetStatus('saved'); renderNote(); schedule();
    toast('GitHub에서 기록을 불러왔어요.');
  } catch(e){ GH.busy = false; ghSetStatus('error'); toast(ghErrText(e)); throw e; }
}
async function ghCheckRemote(){
  if (!ghReady()) return;
  try {
    const head = await ghHead();
    if (head && head !== GH.cfg.lastCommit){
      const c = GH.cfg.lastCommit ? await gh(`/compare/${GH.cfg.lastCommit}...${head}`).catch(() => null) : null;
      if (!c || (c.files || []).some(f => f.filename.startsWith('data/'))){ S.ghNote = {kind:'newer'}; renderNote(); }
      else { GH.cfg.lastCommit = head; ghStore(); }
    }
    ghSetStatus(GH.cfg.dirty ? 'dirty' : 'saved');
  } catch(e){ ghSetStatus('error'); }
}

      <div>4. Permissions › Repository permissions › <b>Contents</b>를 <b>Read and write</b>로 바꿔요.</div>
      <div>5. 만든 토큰을 복사해서 위 칸에 붙여 넣고 ‘연결 확인’을 눌러요.</div>
    </div></details>
    <label class="check-inline"><input type="checkbox" id="gh-auto" ${c.auto ? 'checked' : ''}>기록을 바꾸면 잠시 뒤 자동으로 저장하기</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn" id="gh-connect">연결 확인</button>
      <button class="btn primary" id="gh-savenow" ${ghReady() ? '' : 'disabled'}>${I.up}지금 저장</button>
      <button class="btn" id="gh-loadnow" ${ghReady() ? '' : 'disabled'}>${I.down}불러오기</button>
      ${c.repo || c.token ? `<button class="btn danger" id="gh-off">연결 끊기</button>` : ''}
    </div>
    <div class="hint" id="gh-msg">${c.lastSavedAt ? `마지막 저장 ${esc(new Date(c.lastSavedAt).toLocaleString('ko-KR'))}` : ''}${c.dirty ? ' · 저장 안 한 변경이 있어요' : ''}</div>`;
}
function ghSettingsMount(root){
  if (!isStandalone()) return;
  const msg = $('#gh-msg', root);
  const read = () => {
    GH.cfg.repo = $('#gh-repo', root).value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
    GH.cfg.branch = $('#gh-branch', root).value.trim() || 'main';
    GH.cfg.token = $('#gh-token', root).value.trim();
    GH.cfg.auto = $('#gh-auto', root).checked;
  };
  $('#gh-auto', root).addEventListener('change', () => { GH.cfg.auto = $('#gh-auto', root).checked; ghStore(); });
  $('#gh-connect', root).onclick = async (ev) => {
    const btn = ev.currentTarget; read();
    if (!/^[\w.-]+\/[\w.-]+$/.test(GH.cfg.repo)){ msg.textContent = '저장소는 아이디/저장소이름 모양으로 적어 주세요.'; return; }
    if (!GH.cfg.token){ msg.textContent = '토큰을 넣어 주세요.'; return; }
    setBusy(btn, '확인 중…');
    try {
      const info = await gh('');
      if (info.permissions && !info.permissions.push) throw Object.assign(new Error('perm'), {status:403});
      if (!info.private){ msg.textContent = '이 저장소는 공개(Public)예요. 기록이 누구에게나 보이니, 비공개 저장소를 연결해 주세요.'; GH.cfg.token = ''; setBusy(btn); return; }
      ghStore(); $('#gh-savenow', root).disabled = false; $('#gh-loadnow', root).disabled = false;
      const head = await ghHead(); let hasData = false;
      if (head){ const cm = await gh(`/git/commits/${head}`); const tr = await gh(`/git/trees/${cm.tree.sha}?recursive=1`); hasData = (tr.tree || []).some(t => t.path === 'data/data.json'); }
      msg.textContent = hasData ? '연결됐어요. 저장소에 기록이 있어요. 이 기기에서 처음이면 ‘불러오기’를 눌러 주세요.' : '연결됐어요. ‘지금 저장’을 누르면 이 브라우저의 기록이 저장소로 올라가요.';
      if (hasData && !GH.cfg.lastCommit) { S.ghNote = {kind:'newer'}; renderNote(); }
      renderTop();
    } catch(e){ msg.textContent = ghErrText(e); }
    setBusy(btn);
  };
  $('#gh-savenow', root).onclick = async (ev) => {
    const btn = ev.currentTarget; read(); ghStore(); setBusy(btn, '저장 중…');
    try { await ghSave({progress:(t) => { msg.textContent = t; }}); msg.textContent = `마지막 저장 ${new Date().toLocaleString('ko-KR')}`; }
    catch(e){ msg.textContent = ghErrText(e); }
    setBusy(btn);
  };
  $('#gh-loadnow', root).onclick = async (ev) => {
    const btn = ev.currentTarget; read(); ghStore();
    if (!await confirmBox('이 브라우저의 기록을 GitHub에 저장된 기록으로 바꿀까요?' + (GH.cfg.dirty ? '\n이 브라우저에서 아직 저장 안 한 변경은 사라져요.' : ''), '불러오기', false)) return;
    setBusy(btn, '불러오는 중…');
    try { await ghLoad({progress:(t) => { msg.textContent = t; }}); msg.textContent = '불러왔어요.'; }
    catch(e){ msg.textContent = ghErrText(e); }
    setBusy(btn);
  };
  const off = $('#gh-off', root);
  if (off) off.onclick = async () => {
    if (!await confirmBox('이 기기에서 GitHub 연결을 끊을까요?\n저장소와 이 브라우저의 기록은 그대로 남아요.', '연결 끊기')) return;
    GH.cfg = {}; ghStore(); S.ghNote = null; renderNote(); renderTop(); closeModal(); toast('GitHub 연결을 끊었어요.');
  };
}

/* ---------- navigation & events ---------- */
function go(route){
  S.route = route; S.addMenu = false;
  if (route.view === 'pair'){ S.tab = 'all'; S.q = ''; S.tag = null; S.favOnly = false; S.photoFolder = null; S.photoWall = false; }
  try { history.replaceState(null, '', route.view === 'pair' ? '#p-' + route.pairId : location.pathname + location.search); } catch(e){}
  render(); window.scrollTo(0, 0);
}
function openItem(id){
  const it = S.items[id]; if (!it) return;
  go({view:'pair', pairId:it.pairId});
  S.tab = it.type; if (it.type === 'photo') S.photoFolder = it.folder && (S.pairs[it.pairId].folders || []).some(f => f.id === it.folder) ? it.folder : null; render();
  setTimeout(() => {
    if (it.type === 'text') return openReader(id);
    if (it.type === 'check') return checkDetail(id);
    const el = document.getElementById('it-' + id); if (el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.animate([{outline:'3px solid var(--acc)'}, {outline:'3px solid transparent'}], {duration:1800}); }
  }, 60);
}
const FORMS = {photo:photoForm, tweet:tweetForm, text:textForm, check:checkForm};

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (S.addMenu && (!el || el.dataset.act !== 'add-menu')){ if (!el || el.dataset.act !== 'add'){ S.addMenu = false; schedule(); } }
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'home': go({view:'home'}); break;
    case 'open-pair': go({view:'pair', pairId:id}); break;
    case 'open-item': openItem(id); break;
    case 'new-pair': pairForm(null); break;
    case 'edit-pair': pairForm(S.route.pairId); break;
    case 'customize': customize(); break;
    case 'settings': settings(); break;
    case 'tab': S.tab = el.dataset.tab; S.tag = null; S.addMenu = false; S.photoFolder = null; render(); break;
    case 'folder': S.photoFolder = el.dataset.folder || null; S.tag = null; render(); { const t = $('.tabs-scroll'); if (t) t.scrollIntoView({block:'start'}); } break;
    case 'new-folder': folderForm(S.route.pairId, null); break;
    case 'edit-folder': folderForm(S.route.pairId, el.dataset.folder); break;
    case 'wall': S.photoWall = !S.photoWall; render(); break;
    case 'random': {
      const ids = Object.keys(S.items).filter(k => S.pairs[S.items[k].pairId]);
      if (ids.length) openItem(ids[Math.floor(Math.random() * ids.length)]); break;
    }
    case 'pick': {
      const it = clone(S.items[id]); if (!it) break;
      const rows = clRows(it.data); const r = rows.find(x => x.id === el.dataset.row); if (!r) break;
      const ci = +el.dataset.ci; r.picks = r.picks || []; const k = r.picks.indexOf(ci);
      if (k >= 0) r.picks.splice(k, 1); else { r.picks.push(ci); r.picks.sort(); }
      it.data.rows = rows; it.updatedAt = new Date().toISOString();
      try { await put('items', id, it); } catch(e){}
      break;
    }
    case 'tag': S.tag = S.tag === el.dataset.tag ? null : el.dataset.tag; render(); break;
    case 'fav-only': S.favOnly = !S.favOnly; render(); break;
    case 'sort': S.sortAsc = !S.sortAsc; render(); break;
    case 'add-menu': S.addMenu = !S.addMenu; render(); break;
    case 'add': S.addMenu = false; render(); FORMS[el.dataset.type](S.route.pairId, null); break;
    case 'edit': { const it = S.items[id]; if (it) FORMS[it.type](it.pairId, id); break; }
    case 'delete': {
      const it = S.items[id]; if (!it) break;
      if (await confirmBox(`'${displayTitle(it)}' 기록을 지울까요?\n함께 올린 사진과 파일도 지워지고 되돌릴 수 없어요.`)){
        const p = S.pairs[it.pairId]; const charRefs = new Set((p?.chars||[]).map(c => c.avatar).filter(Boolean));
        const refs = [...collectRefs(it.data)].filter(r => !charRefs.has(r));
        try { await del('items', id); for (let k = 1; k < ((it.data || {}).parts || 1); k++) { try { await del('bodies', `${id}_${k}`); } catch(e){} } dropAssets(refs); toast('기록을 지웠어요.'); } catch(e){}
      }
      break;
    }
    case 'fav': { const it = clone(S.items[id]); if (!it) break; it.fav = !it.fav; try { await put('items', id, it); } catch(e){} break; }
    case 'read': openReader(id); break;
    case 'open-check': checkDetail(id); break;
    case 'gh-save': ghSave().catch(() => {}); break;
    case 'gh-force': if (await confirmBox('다른 기기에서 저장한 내용을 이 브라우저 내용으로 덮어쓸까요?\n덮어쓴 내용은 GitHub 저장소 기록(커밋 내역)에서만 되찾을 수 있어요.', '덮어쓰기')) ghSave({force:true}).catch(() => {}); break;
    case 'gh-load': if (await confirmBox('이 브라우저의 기록을 GitHub에 저장된 기록으로 바꿀까요?' + (GH.cfg.dirty ? '\n이 브라우저에서 아직 저장 안 한 변경은 사라져요.' : ''), '불러오기', false)) ghLoad().catch(() => {}); break;
    case 'gh-note-x': S.ghNote = null; renderNote(); break;
    case 'gs-tab': GS_TAB[id] = +el.dataset.i; render(); break;
    case 'del-pair': deletePair(id || S.route.pairId); break;
    case 'lb': {
      const key = el.dataset.set; const itemId = key.split(':')[0]; const it = S.items[itemId];
      openLB(key, +el.dataset.i, it && it.type === 'photo' ? {title: it.title, desc: it.data.desc} : (key === 'wall' ? {} : null)); break;
    }
  }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'toggle-row'){
    const it = clone(S.items[el.dataset.id]); if (!it) return;
    const r = (it.data.rows||[]).find(x => x.id === el.dataset.row); if (!r) return;
    r.done = el.checked; it.updatedAt = new Date().toISOString();
    try { await put('items', el.dataset.id, it); } catch(err){ el.checked = !el.checked; }
  }
});
let qTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'gq'){ S.gq = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(render, 160); }
  if (e.target.id === 'pq'){ S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(render, 160); }
});
document.addEventListener('keydown', (e) => {
  if (RD && e.key === 'Escape' && !$('#modal-root').innerHTML){ const pn = $('#rd-panel'); if (pn && !pn.hidden) pn.hidden = true; else closeReader(); return; }
  if ($('#lb-root').innerHTML){
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowRight' && LB_STATE) LB_STATE.next();
    if (e.key === 'ArrowLeft' && LB_STATE) LB_STATE.prev();
    return;
  }
  if (e.key === 'Escape'){
    if ($('#confirm-root').innerHTML){ $('#confirm-root').innerHTML = ''; return; }
    if ($('#modal-root').innerHTML) closeModal();
    else if (S.addMenu){ S.addMenu = false; render(); }
  }
});
window.addEventListener('beforeunload', (e) => { if (ghReady() && GH.cfg.dirty && GH.cfg.auto){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => { const m = /^#p-([A-Za-z0-9]+)$/.exec(location.hash); if (m && S.pairs[m[1]] && S.route.pairId !== m[1]) go({view:'pair', pairId:m[1]}); });

/* ---------- start ---------- */
const m0 = /^#p-([A-Za-z0-9]+)$/.exec(location.hash);
if (m0) S.route = {view:'pair', pairId:m0[1]};
render();
boot();
})();
</script>
