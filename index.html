/* ---------- checklist = Google Sheet as-is ---------- */
const GS_TAGS = new Set(['TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','COLGROUP','COL','DIV','SPAN','B','STRONG','I','EM','U','S','BR','P','A','FONT']);
const GS_DROP = new Set(['SCRIPT','STYLE','IMG','IFRAME','OBJECT','EMBED','SVG','LINK','META','TEMPLATE','NOSCRIPT','INPUT','BUTTON','FORM','VIDEO','AUDIO','CANVAS']);
const GS_CSS = /^(background(-color)?|color|font-weight|font-style|font-size|font-family|text-decoration(-line|-color|-style)?|text-align|vertical-align|white-space|width|min-width|max-width|height|border(-(top|right|bottom|left))?(-(width|style|color))?|padding(-(top|right|bottom|left))?|overflow-wrap|word-break|wrap-option)$/i;
function gsClean(src, out){
  for (const n of Array.from(src.childNodes)){
    if (n.nodeType === 3){ out.appendChild(document.createTextNode(n.textContent)); continue; }
    if (n.nodeType !== 1) continue;
    const tag = n.tagName.toUpperCase();
    if (GS_DROP.has(tag)) continue;
    if (!GS_TAGS.has(tag)){ gsClean(n, out); continue; }
    const e = document.createElement(tag === 'FONT' ? 'span' : tag);
    ['colspan','rowspan'].forEach(a => { if (n.hasAttribute(a)) e.setAttribute(a, String(Math.max(1, Math.min(500, parseInt(n.getAttribute(a)) || 1)))); });
    if (tag === 'COL' && n.getAttribute('width')) e.setAttribute('width', String(parseInt(n.getAttribute('width')) || ''));
    if (tag === 'A'){ const h = n.getAttribute('href') || ''; if (/^https?:\/\//i.test(h)){ e.setAttribute('href', h); e.setAttribute('target', '_blank'); e.setAttribute('rel', 'noopener noreferrer'); } }
    const keep = [];
    const st = n.getAttribute('style');
    if (st) st.split(';').forEach(s => { const i = s.indexOf(':'); if (i < 0) return; const k = s.slice(0, i).trim(), v = s.slice(i + 1).trim(); if (GS_CSS.test(k) && !/url\s*\(|expression|javascript:|@import/i.test(v)) keep.push(`${k}:${v}`); });
    if (tag === 'FONT' && /^#?[0-9a-z]{3,20}$/i.test(n.getAttribute('color') || '')) keep.push(`color:${n.getAttribute('color')}`);
    const bg = n.getAttribute('bgcolor'); if (bg && /^#?[0-9a-f]{3,8}$/i.test(bg)) keep.push(`background-color:${bg[0] === '#' ? bg : '#' + bg}`);
    if (keep.length) e.setAttribute('style', keep.join(';'));
    gsClean(n, e); out.appendChild(e);
  }
}
function gsSanitize(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const table = doc.querySelector('table'); if (!table) return '';
  const wrap = document.createElement('div'); gsClean({childNodes:[table]}, wrap);
  wrap.querySelectorAll('td,th').forEach(c => {
    if (c.children.length) return; const t = c.textContent.trim();
    if (t === 'TRUE' || t === 'FALSE'){ c.textContent = ''; const s = document.createElement('span'); s.className = 'gs-box' + (t === 'TRUE' ? ' on' : ''); s.setAttribute('aria-label', t === 'TRUE' ? '체크됨' : '체크 안 됨'); c.appendChild(s); c.style.textAlign = 'center'; }
  });
  return wrap.innerHTML;
}
function tsvToTable(text){
  const rows = String(text || '').replace(/\r/g, '').split('\n'); while (rows.length && !rows[rows.length - 1].trim()) rows.pop();
  if (!rows.length) return '';
  const w = Math.max(...rows.map(r => r.split('\t').length));
  return `<table>${rows.map(r => { const c = r.split('\t'); while (c.length < w) c.push(''); return `<tr>${c.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`; }).join('')}</table>`;
}
async function fileToTabs(file){
  if (/\.(csv|tsv|txt)$/i.test(file.name)){
    const text = await file.text(); const sep = /\.csv$/i.test(file.name) ? ',' : '\t';
    let html = sep === '\t' ? tsvToTable(text) : '';
    if (!html){ await loadScript(LIB.xlsx); const wb = window.XLSX.read(text, {type:'string'}); return wbTabs(wb); }
    return [{name: file.name.replace(/\.[^.]+$/, ''), html: gsSanitize(html)}];
  }

function wbTabs(wb){
  return wb.SheetNames.map(name => {

      $('#p-addc', root).onclick = () => { sync(); const pal = ['#7CC4A0','#F2B85B','#A58BE0','#5FB8D6','#E08B5F']; st.chars.push({name:'', handle:'', color: pal[st.chars.length % pal.length], avatar:'', profile:'', avFile:null, avPrev:''}); draw(); };
      $('#p-cover', root).addEventListener('change', e => { const f = e.target.files[0]; if (f){ st.coverFile = f; st.coverPrev = URL.createObjectURL(f); drawCover(); } });
      $('#p-coverrm', root).onclick = () => { st.coverFile = null; st.coverPrev = ''; st.cover = ''; drawCover(); };
      draw(); drawCover();
      $('[data-m=cancel]', root).onclick = () => closeModal();
      const del = $('#p-del', root); if (del) del.onclick = () => trashPair(id);
      $('#p-save', root).onclick = async (ev) => {
        sync(); const btn = ev.currentTarget;
        if (!st.chars.some(c => c.name.trim()) && !$('#p-name', root).value.trim()){ toast('페어 이름이나 캐릭터 이름을 하나 이상 적어 주세요.'); return; }
        const badB = st.chars.find(c => (c.birthday || '').trim() && !parseMD(c.birthday)); if (badB){ toast(`${badB.name || '캐릭터'} 생일은 03-02처럼 적어 주세요.`); return; }
        try {
          setBusy(btn, '저장 중…');
          for (const c of st.chars){ if (c.avFile){ setBusy(btn); setBusy(btn, '사진 올리는 중…'); c.avatar = await uploadFile(c.avFile); } }
          if (st.coverFile){ setBusy(btn); setBusy(btn, '커버 올리는 중…'); st.cover = await uploadFile(st.coverFile); }
          if (st.thumbFile){ setBusy(btn); setBusy(btn, '대표 이미지 올리는 중…'); st.thumb = await uploadFile(st.thumbFile); }
          const out = {...(old ? clone(old) : newPairObj()), name: $('#p-name', root).value.trim(), since: $('#p-since', root).value, tags: parseTags($('#p-tags', root).value), intro: $('#p-intro', root).value, cover: st.cover || '', thumb: st.thumb || '', thumbPos: st.thumbPos,
            annivs: (st.annivs || []).filter(a => (a.name || '').trim() && a.date).map(a => ({id: a.id || uid(), name: a.name.trim(), date: a.date, yearly: !!a.yearly})),
            chars: st.chars.map(c => ({name:(c.name||'').trim(), handle:(c.handle||'').trim().replace(/^@/,''), color: safeColor(c.color), avatar:c.avatar || '', profile:c.profile || '', birthday: parseMD(c.birthday) || ''}))};
          const newId = id || uid();
          await put('pairs', newId, out);
          if (old) dropAssets([old.cover, old.thumb].filter(r => r && r !== out.cover && r !== out.thumb));
          closeModal(); toast(old ? '페어 정보를 저장했어요.' : '새 페어를 만들었어요.');
          if (!old) go({view:'pair', pairId:newId});
        } catch(e){ setBusy(btn); toast(errText(e)); }
      };
    }});
}
async function deletePair(id){
  const p = S.pairs[id]; const its = itemsOf(id);
  const ok = await confirmBox(`'${pairTitle(p)}' 페어와 기록 ${its.length}개를 모두 지울까요?\n올린 사진과 PDF도 함께 지워지고 되돌릴 수 없어요. 먼저 설정에서 백업 파일을 받아 두면 안전해요.`, '모두 삭제');
  if (!ok) return;
  closeModal();
  try {
    const refs = new Set(); collectRefs(p, refs);
    for (const it of its){ collectRefs(it.data, refs); await del('items', it.id); for (let k = 1; k < ((it.data || {}).parts || 1); k++) { try { await del('bodies', `${it.id}_${k}`); } catch(e){} } }
    if (MX.pairId === id){ mxStop(); MX.list = []; MX.pairId = null; mxRender(); }
    await del('pairs', id); dropAssets([...refs]);
    go({view:'home'}); toast('페어를 지웠어요.');
  } catch(e){}
}

async function importBackup(file, status){

      try { map[r] = await uploadFile(new File([blob], fname, {type})); } catch(e){ map[r] = ''; }
    }
    const fix = (o) => mapRefs(o, v => (v && map[v] !== undefined) ? map[v] : v);
    status.textContent = '기록 저장하는 중…';
    if (data.site && data.site.title) await put('site', 'main', fix({title:data.site.title, sub:data.site.sub || '', me:data.site.me || {name:'', handle:'', avatar:''}}));
    for (const [bid, b] of Object.entries(data.bodies || {})) await put('bodies', bid, b);
    for (const [id, p] of Object.entries(data.pairs)) await put('pairs', id, fix(p));
    let k = 0; for (const [id, it] of Object.entries(data.items || {})){ k++; if (k % 10 === 0) status.textContent = `기록 저장하는 중 ${k}/${ni}`; await put('items', id, fix(it)); }

  } catch(e){ status.textContent = '이 파일은 Pair Archive 백업 파일이 아니거나 손상됐어요.'; }
}

async function gh(path, opts={}){

async function ghSave({force=false, auto=false, progress}={}){
  if (!ghReady() || GH.busy) return;
  GH.busy = true; clearTimeout(GH.timer); ghSetStatus('saving');
  const say = (t) => { if (progress) progress(t); };
  try {
    let head = await ghHead();
    if (!head){
      say('저장소를 준비하는 중…');
      const readme = '# Pair Archive 기록\n\nPair Archive가 저장한 기록이에요. data 폴더를 직접 고치지 말아 주세요.\n';
      await gh('/contents/README.md', {method:'PUT', body:{message:'Pair Archive 기록 저장소 시작', content: btoa(unescape(encodeURIComponent(readme))), branch: ghBranch()}});
      head = await ghHead();
    }
    if (!force && GH.cfg.lastCommit && head !== GH.cfg.lastCommit){
      const c = await gh(`/compare/${GH.cfg.lastCommit}...${head}`).catch(() => null);
      const touched = !c || (c.files || []).some(f => f.filename.startsWith('data/'));
      if (touched){ const err = new Error('conflict'); err.code = 'conflict'; throw err; }
    }

    const tree = await gh(`/git/trees/${commit.tree.sha}?recursive=1`);
    const remote = new Map((tree.tree || []).filter(t => t.type === 'blob' && t.path.startsWith('data/assets/')).map(t => [t.path, t.sha]));
    const refs = [...collectRefs({p:allPairs(), i:allItems(), s:S.site})];
    const entries = [], want = new Set(), files = {};
    let n = 0;
    for (const ref of refs){
      n++; const blob = await localBlob(ref); if (!blob) continue;
      const path = `data/assets/${ref}.${TYPE_EXT[blob.type] || 'bin'}`;
      files[ref] = path; want.add(path);

}
async function ghLoad({progress}={}){
  if (!ghReady() || GH.busy) return;

  const say = (t) => { if (progress) progress(t); };
  try {
    const head = await ghHead(); if (!head){ const err = new Error('nodata'); err.code = 'nodata'; throw err; }
    const commit = await gh(`/git/commits/${head}`);
    const tree = await gh(`/git/trees/${commit.tree.sha}?recursive=1`);
    const byPath = new Map((tree.tree || []).map(t => [t.path, t.sha]));
    if (!byPath.has('data/data.json')){ const err = new Error('nodata'); err.code = 'nodata'; throw err; }
    say('기록 받는 중…');
    const raw = await gh(`/git/blobs/${byPath.get('data/data.json')}`);
    const data = JSON.parse(new TextDecoder().decode(b64ToBytes(raw.content)));

      const b = await gh(`/git/blobs/${byPath.get(path)}`);
      const blob = new Blob([b64ToBytes(b.content)], {type: EXT_TYPE[path.split('.').pop()] || 'application/octet-stream'});

    S.ghNote = null; GH.busy = false; ghSetStatus('saved'); renderNote(); schedule();
    toast('GitHub에서 기록을 불러왔어요.');
  } catch(e){ GH.busy = false; ghSetStatus('error'); toast(ghErrText(e)); throw e; }
}

function mxTrack(){ return MX.list[MX.idx]; }
function mxLoadPair(pid){

function loadYT(){

    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { MX.ytReady = null; rej(new Error('yt')); };

async function mxPlay(i, quiet){

const TRASH_DAYS = 30;

}

const allPairs = () => ({...S.pairs, ...S.trashPairs});

  const it = clone(S.items[id]); if (!it) return;

}

  } catch(e){}
}

function parseMD(s){

  let dt = new Date(y, m - 1, d); if (dt < from) dt = new Date(y + 1, m - 1, d); return dt;
}
function pairEvents(pid, p, days){
  const from = dayStart(new Date()); const to = new Date(from.getTime() + days * 86400000); const out = [];
  const add = (date, label, kind) => { if (date >= from && date <= to) out.push({pid, date, label, kind}); };
  (p.chars || []).forEach(c => { if (c.birthday){ const md = parseMD(c.birthday); if (md) add(nextYearly(md, from), `${c.name || '캐릭터'} 생일`, 'birthday'); } });
  if (p.since && /^\d{4}-\d{2}-\d{2}$/.test(p.since)){
    const [y, m, d] = p.since.split('-').map(Number); const start = new Date(y, m - 1, d);
    const ny = nextYearly(`${pad(m)}-${pad(d)}`, from); const years = ny.getFullYear() - y; if (years > 0) add(ny, `${years}주년`, 'anniv');
    for (let t = from.getTime(); t <= to.getTime(); t += 86400000){
      const day = new Date(t); const n = Math.round((dayStart(day) - start) / 86400000) + 1;
      if (n > 0 && n % 100 === 0) add(dayStart(day), `D+${n}`, 'dday');
    }
  }
  (p.annivs || []).forEach(a => {
    if (!a.date) return;
    if (a.yearly){ const md = a.date.slice(5); const dt = nextYearly(md, from); const yrs = dt.getFullYear() - +a.date.slice(0, 4); add(dt, `${a.name}${yrs > 0 ? ` ${yrs}주년` : ''}`, 'custom'); }
    else { const [y, m, d] = a.date.split('-').map(Number); add(new Date(y, m - 1, d), a.name, 'custom'); }
  });
  return out;
}
function upcomingEvents(days){
  const out = []; Object.entries(S.pairs).forEach(([pid, p]) => out.push(...pairEvents(pid, p, days)));
  return out.sort((a, b) => a.date - b.date);
}

function sha256(ascii){

  W[l >> 2] |= 0x80 << ((3 - l % 4) * 8); W[n - 1] = l * 8;
  for (let j = 0; j < n; j += 16){
    const w = W.slice(j, j + 16); let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++){

/* ---------- tag picker ---------- */
function tagCounts(pairId){
  const all = {}, mine = {};
  Object.values(S.items).forEach(it => (it.tags || []).forEach(t => { all[t] = (all[t] || 0) + 1; if (it.pairId === pairId) mine[t] = (mine[t] || 0) + 1; }));
  return Object.keys(all).sort((a, b) => (mine[b] || 0) - (mine[a] || 0) || all[b] - all[a] || a.localeCompare(b, 'ko')).map(t => ({t, n: mine[t] || 0, all: all[t]}));
}
function tagPickHTML(hiddenId, tags, label='태그', placeholder='태그를 고르거나 새로 쓰기'){
  const inId = hiddenId + '-q';
  return `<div class="field tpfield"><label for="${inId}">${label}</label>
    <div class="tagpick" data-tp="${hiddenId}">${tpChips(tags)}<input class="tp-in" id="${inId}" data-tp="${hiddenId}" placeholder="${placeholder}" autocomplete="off" enterkeyhint="done"></div>
    <div class="tp-drop" id="${hiddenId}-drop" hidden></div>
    <input type="hidden" id="${hiddenId}" value="${esc((tags || []).join(', '))}"></div>`;
}
function tpChips(tags){ return (tags || []).map(t => `<span class="tp-chip">#${esc(t)}<button type="button" data-tprm="${esc(t)}" aria-label="${esc(t)} 태그 빼기">${I.x}</button></span>`).join(''); }
function tpGet(hid){ return parseTags(($('#' + hid) || {}).value || ''); }
function tpSet(hid, tags){
  const h = $('#' + hid); if (!h) return; h.value = tags.join(', ');
  const wrap = $(`.tagpick[data-tp="${hid}"]`); $$('.tp-chip', wrap).forEach(x => x.remove());
  wrap.insertAdjacentHTML('afterbegin', tpChips(tags));
}
function tpDrop(hid){
  const drop = $('#' + hid + '-drop'), inp = $('#' + hid + '-q'); if (!drop || !inp) return;
  const q = inp.value.trim().replace(/^#/, ''); const have = new Set(tpGet(hid));
  const list = tagCounts(S.route.pairId).filter(x => !have.has(x.t) && (!q || x.t.toLowerCase().includes(q.toLowerCase()))).slice(0, 30);
  const exact = list.some(x => x.t === q) || have.has(q);
  if (!list.length && !q){ drop.hidden = true; return; }
  drop.innerHTML = (q && !exact ? `<button type="button" class="tp-opt new" data-tpadd="${esc(q)}">${I.plus}<b>#${esc(q)}</b> 새 태그로 넣기</button>` : '')
    + list.map(x => `<button type="button" class="tp-opt" data-tpadd="${esc(x.t)}"><span>#${esc(x.t)}</span><span class="hint mono">${x.n ? `이 페어 ${x.n}` : `다른 페어 ${x.all}`}</span></button>`).join('')
    + (!list.length && exact ? '<div class="hint" style="padding:8px 10px">이미 넣은 태그예요.</div>' : '');
  drop.hidden = false; drop.dataset.for = hid;
}
function tpAdd(hid, t){
  t = String(t || '').trim().replace(/^#+/, ''); if (!t) return;
  const tags = tpGet(hid); if (!tags.includes(t)) tags.push(t);
  tpSet(hid, tags); const inp = $('#' + hid + '-q'); inp.value = ''; inp.focus(); tpDrop(hid);
}
document.addEventListener('focusin', e => { const i = e.target.closest && e.target.closest('.tp-in'); if (i) tpDrop(i.dataset.tp); });
document.addEventListener('input', e => { const i = e.target.closest && e.target.closest('.tp-in'); if (!i) return; if (/[,，]/.test(i.value)){ i.value.split(/[,，]/).slice(0, -1).forEach(t => tpAdd(i.dataset.tp, t)); i.value = i.value.split(/[,，]/).pop(); } tpDrop(i.dataset.tp); });
document.addEventListener('keydown', e => {
  const i = e.target.closest && e.target.closest('.tp-in'); if (!i) return; const hid = i.dataset.tp;
  if (e.key === 'Enter'){ e.preventDefault(); if (i.value.trim()) tpAdd(hid, i.value); else { const f = $(`#${hid}-drop .tp-opt`); if (f && !$('#' + hid + '-drop').hidden) tpAdd(hid, f.dataset.tpadd); } }
  else if (e.key === 'Backspace' && !i.value){ const tags = tpGet(hid); tags.pop(); tpSet(hid, tags); tpDrop(hid); }
  else if (e.key === 'Escape'){ const d = $('#' + hid + '-drop'); if (d && !d.hidden){ e.stopPropagation(); d.hidden = true; } }
}, true);
document.addEventListener('mousedown', e => { if (e.target.closest('.tp-drop') || e.target.closest('[data-tprm]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-tpadd]'); if (a){ tpAdd(a.closest('.tp-drop').dataset.for, a.dataset.tpadd); return; }
  const r = e.target.closest('[data-tprm]'); if (r){ const hid = r.closest('.tagpick').dataset.tp; tpSet(hid, tpGet(hid).filter(t => t !== r.dataset.tprm)); tpDrop(hid); return; }
  const w = e.target.closest('.tagpick'); if (w && !e.target.closest('.tp-in')) $('.tp-in', w).focus();
  $$('.tp-drop').forEach(d => { if (!d.hidden && !e.target.closest('.tpfield')) d.hidden = true; });
});

/* ---------- calendar ---------- */
function monthEvents(p, y, m){
  const out = {}; const add = (d, label, kind) => { (out[d] = out[d] || []).push({label, kind}); };
  const dim = new Date(y, m, 0).getDate(); const md = (mm, dd) => `${pad(mm)}-${pad(dd)}`;
  (p.chars || []).forEach(c => { if (c.birthday && +c.birthday.slice(0, 2) === m && +c.birthday.slice(3) <= dim) add(+c.birthday.slice(3), `${c.name || '캐릭터'} 생일`, 'birthday'); });
  (p.annivs || []).forEach(a => {
    if (!a.date) return; const [ay, am, ad] = a.date.split('-').map(Number);
    if (a.yearly){ if (am === m && y >= ay) add(ad, `${a.name}${y > ay ? ` ${y - ay}주년` : ''}`, 'custom'); }
    else if (ay === y && am === m) add(ad, a.name, 'custom');
  });
  if (p.since && /^\d{4}-\d{2}-\d{2}$/.test(p.since)){
    const [sy, sm, sd] = p.since.split('-').map(Number); const start = new Date(sy, sm - 1, sd);
    if (sm === m && y > sy) add(sd, `${y - sy}주년`, 'anniv');
    if (sm === m && y === sy) add(sd, '시작한 날', 'anniv');
    for (let d = 1; d <= dim; d++){ const n = Math.round((new Date(y, m - 1, d) - start) / 86400000) + 1; if (n > 0 && n % 100 === 0) add(d, `D+${n}`, 'dday'); }
  }
  return out;
}
function calView(pid, p, all, th, tabs){
  const t = new Date(); if (!S.calYM) S.calYM = `${t.getFullYear()}-${pad(t.getMonth() + 1)}`;
  const [y, m] = S.calYM.split('-').map(Number);
  const first = new Date(y, m - 1, 1), dim = new Date(y, m, 0).getDate(), lead = first.getDay();
  const ev = monthEvents(p, y, m);
  const vis = all.filter(it => tabs[it.type]);
  const byDay = {}; vis.forEach(it => { const d = itemDate(it); if (d.slice(0, 7) === S.calYM) (byDay[+d.slice(8, 10)] = byDay[+d.slice(8, 10)] || []).push(it); });
  const today = todayStr();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cal-c pad"></span>';
  for (let d = 1; d <= dim; d++){
    const ds = `${S.calYM}-${pad(d)}`; const its = byDay[d] || []; const es = ev[d] || [];
    const types = TYPE_ORDER.filter(tp => its.some(it => it.type === tp));
    cells += `<button class="cal-c ${ds === today ? 'today' : ''} ${ds === S.calDay ? 'sel' : ''} ${es.length ? 'has-ev' : ''} ${(new Date(y, m - 1, d)).getDay() === 0 ? 'sun' : ''}" data-act="cal-day" data-d="${ds}" aria-label="${m}월 ${d}일 기록 ${its.length}개">
      <span class="cal-n">${d}</span>
      ${es.slice(0, 2).map(e => `<span class="cal-ev ev-${e.kind}">${esc(e.label)}</span>`).join('')}
      ${its.length ? `<span class="cal-dots">${types.map(tp => `<i class="dt-${tp}"></i>`).join('')}${its.length > 1 ? `<em>${its.length}</em>` : ''}</span>` : ''}
    </button>`;
  }
  const mCount = Object.values(byDay).reduce((n, a) => n + a.length, 0);
  let dayHTML = '';
  if (S.calDay && S.calDay.slice(0, 7) === S.calYM){
    const d = +S.calDay.slice(8); const its = (byDay[d] || []).slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const wd = WD[new Date(y, m - 1, d).getDay()];
    dayHTML = `<div class="sec-h" style="margin:22px 0 10px"><h2 style="font-family:var(--pf)">${m}월 ${d}일 (${wd})</h2>${S.canWrite ? `<div class="addwrap"><button class="btn small primary" data-act="add-menu">${I.plus}이날 기록 추가</button>${S.addMenu ? `<div class="addmenu">${TYPE_ORDER.filter(tp => tabs[tp]).map(tp => `<button data-act="add" data-type="${tp}" data-date="${S.calDay}">${TYPES[tp]}</button>`).join('')}</div>` : ''}</div>` : ''}</div>
      ${(ev[d] || []).length ? `<div class="chips" style="margin:0 0 12px">${ev[d].map(e => `<span class="chip on">${esc(e.label)}</span>`).join('')}</div>` : ''}
      ${its.length ? feedHTML(its, th, p) : '<div class="empty"><p>이날 넣은 기록이 없어요.</p></div>'}`;
  }
  return `<div class="cal-head">
      <button class="mini" data-act="cal-mv" data-d="-1" aria-label="지난달">${I.left}</button>
      <h2>${y}년 ${m}월</h2>
      <button class="mini" data-act="cal-mv" data-d="1" aria-label="다음 달">${I.right}</button>
      <button class="btn small" data-act="cal-today">오늘</button>
      <span class="hint" style="margin-left:auto">이달 기록 ${mCount}개</span>
    </div>
    <div class="cal-legend hint">${TYPE_ORDER.filter(tp => tabs[tp]).map(tp => `<span><i class="dt-${tp}"></i>${TYPES[tp]}</span>`).join('')}<span><i class="dt-ev"></i>생일·기념일</span></div>
    <div class="cal">${WD.map((w, i) => `<span class="cal-w ${i === 0 ? 'sun' : ''}">${w}</span>`).join('')}${cells}</div>
    ${dayHTML}`;
}

async function bulkApply(fn, msg){
  const ids = [...S.sel.ids].filter(id => S.items[id]); let n = 0;
  try { for (const id of ids){ const it = clone(S.items[id]); if (fn(it) !== false){ it.updatedAt = new Date().toISOString(); await put('items', id, it); n++; } } toast(msg.replace('%n', n)); }
  catch(e){ toast(errText(e)); }
}
function bulkAction(op){
  const pid = S.route.pairId; const p = S.pairs[pid]; const ids = [...S.sel.ids].filter(id => S.items[id]);
  if (!ids.length) return;

  if (op === 'trash'){

      try { for (const id of ids){ const it = clone(S.items[id]); it.trashedAt = at; await put('items', id, it); } S.sel.ids.clear(); toast(`${ids.length}개를 휴지통으로 옮겼어요.`); } catch(e){}

      ${Object.keys(cur).length ? `<div class="field"><span class="flabel">뺄 태그 (눌러서 고르기)</span><div class="chips" id="b-rm" style="margin:0">${Object.entries(cur).sort((a, b) => b[1] - a[1]).map(([t, c]) => `<button type="button" class="chip" data-t="${esc(t)}">#${esc(t)} <span class="mono">${c}</span></button>`).join('')}</div></div>` : ''}`,
      foot:`<button class="btn" data-m="cancel">취소</button><button class="btn primary" id="b-ok">적용</button>`,
      onMount(root){ $('[data-m=cancel]', root).onclick = () => closeModal();

      <button class="tv-nav prev" id="tv-prev" aria-label="이전 트윗" ${TV.i === 0 ? 'disabled' : ''}>${I.left}</button>
      <div class="tv-scroll" id="tv-scroll"><article class="card tv-card ${TV.dir > 0 ? 'in-r' : TV.dir < 0 ? 'in-l' : ''}">${body}
        ${(it.tags || []).length ? `<div class="tv-tags">${it.tags.map(t => `<span class="tg">#${esc(t)}</span>`).join('')}</div>` : ''}</article></div>
      <button class="tv-nav next" id="tv-next" aria-label="다음 트윗" ${TV.i === TV.ids.length - 1 ? 'disabled' : ''}>${I.right}</button>
    </div>
    <div class="tv-hint hint">← → 키나 옆으로 밀어서 넘겨요</div>
  </div>`;
  TV.dir = 0;
  const sc = $('#tv-scroll'); if (keep) sc.scrollTop = st;
  $('#tv-x').onclick = closeTV; $('#tv-prev').onclick = () => tvGo(-1); $('#tv-next').onclick = () => tvGo(1);
  let sx = null, sy = null;
  sc.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  sc.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) tvGo(dx < 0 ? 1 : -1); sx = null; });
}
document.addEventListener('keydown', e => {
  if (!TV || $('#lb-root').innerHTML || $('#modal-root').innerHTML) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); tvGo(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); tvGo(-1); }
  else if (e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); closeTV(); }
}, true);

/* ---------- home quote ---------- */
function allQuotes(){
  const out = [];
  Object.entries(S.items).forEach(([id, it]) => { if (it.type !== 'text' || !S.pairs[it.pairId] || isHidden({id, ...it})) return; (it.data?.highlights || []).forEach(h => out.push({id, it, h})); });
  return out;
}
function homeQuoteHTML(){
  const qs = allQuotes(); if (!qs.length) return '';
  let q = qs.find(x => x.h.id === S.homeQ); if (!q){ q = qs[Math.floor(Math.random() * qs.length)]; S.homeQ = q.h.id; }
  const p = S.pairs[q.it.pairId]; const {c1, c2} = pairColors(p);
  return `<div class="hq" style="--c1:${c1};--c2:${c2};--hqf:${(FONTS[(p.theme || {}).font] || FONTS.plex).css}">
    <button class="hq-main" data-act="hl-open" data-id="${esc(q.id)}" data-hl="${esc(q.h.id)}">
      <span class="hq-mark" aria-hidden="true">“</span>
      <span class="hq-t">${esc(q.h.text)}</span>
      <span class="hq-src">${esc(q.it.title || '제목 없는 글')} · ${esc(pairTitle(p))}</span>
    </button>
    ${qs.length > 1 ? `<button class="mini hq-next" data-act="hq-next" title="다른 문장" aria-label="다른 문장 보기">${I.shuffle}</button>` : ''}
  </div>`;
}

/* ---------- navigation & events ---------- */
function go(route){
  S.route = route; S.addMenu = false; if (typeof MX !== 'undefined') MX.hidden = false;
  if (route.view === 'pair'){ S.tab = 'all'; S.q = ''; S.tag = null; S.favOnly = false; S.photoFolder = null; S.photoWall = false; S.auSel = null; S.auFilter = null; S.seriesSel = null; S.hlAll = false; }
  S.reorder = null; S.sel.on = false; S.sel.ids.clear(); S.calDay = null; if (TV) closeTV();
  try { history.replaceState(null, '', route.view === 'pair' ? '#p-' + route.pairId : location.pathname + location.search); } catch(e){}
  render(); window.scrollTo(0, 0);
}
function openItem(id){
  const it = S.items[id]; if (!it) return;
  go({view:'pair', pairId:it.pairId});
  S.tab = it.type; if (it.type === 'photo') S.photoFolder = it.folder && (S.pairs[it.pairId].folders || []).some(f => f.id === it.folder) ? it.folder : null; render();
  setTimeout(() => {
    if (it.type === 'text') return openReader(id);
    if (it.type === 'check') return checkDetail(id);
    const el = document.getElementById('it-' + id); if (el){ el.scrollIntoView({block:'center', behavior:'smooth'}); el.animate([{outline:'3px solid var(--acc)'}, {outline:'3px solid transparent'}], {duration:1800}); }
  }, 60);
}
const FORMS = {photo:photoForm, tweet:tweetForm, text:textForm, check:checkForm};

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (S.addMenu && (!el || el.dataset.act !== 'add-menu')){ if (!el || el.dataset.act !== 'add'){ S.addMenu = false; schedule(); } }
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'home': go({view:'home'}); break;
    case 'open-pair': go({view:'pair', pairId:id}); break;
    case 'open-item': openItem(id); break;
    case 'new-pair': pairForm(null); break;
    case 'edit-pair': pairForm(S.route.pairId); break;
    case 'customize': customize(); break;
    case 'settings': settings(); break;
    case 'tab': S.tab = el.dataset.tab; S.tag = null; S.addMenu = false; S.photoFolder = null; S.seriesSel = null; S.sel.ids.clear(); render(); break;
    case 'folder': S.photoFolder = el.dataset.folder || null; S.tag = null; render(); { const t = $('.tabs-scroll'); if (t) t.scrollIntoView({block:'start'}); } break;
    case 'new-folder': folderForm(S.route.pairId, null); break;
    case 'edit-folder': folderForm(S.route.pairId, el.dataset.folder); break;
    case 'wall': S.photoWall = !S.photoWall; render(); break;
    case 'random': {
      const ids = Object.keys(S.items).filter(k => S.pairs[S.items[k].pairId]);
      if (ids.length) openItem(ids[Math.floor(Math.random() * ids.length)]); break;
    }
    case 'pick': {
      const it = clone(S.items[id]); if (!it) break;
      const rows = clRows(it.data); const r = rows.find(x => x.id === el.dataset.row); if (!r) break;
      const ci = +el.dataset.ci; r.picks = r.picks || []; const k = r.picks.indexOf(ci);
      if (k >= 0) r.picks.splice(k, 1); else { r.picks.push(ci); r.picks.sort(); }
      it.data.rows = rows; it.updatedAt = new Date().toISOString();
      try { await put('items', id, it); } catch(e){}
      break;
    }
    case 'tag': S.tag = S.tag === el.dataset.tag ? null : el.dataset.tag; render(); break;
    case 'fav-only': S.favOnly = !S.favOnly; render(); break;
    case 'sort': S.sortAsc = !S.sortAsc; render(); break;
    case 'add-menu': S.addMenu = !S.addMenu; render(); break;
    case 'add': S.addMenu = false; S.formAU = el.dataset.au !== undefined ? el.dataset.au : ''; S.formDate = el.dataset.date || ''; render(); FORMS[el.dataset.type](S.route.pairId, null); S.formAU = ''; S.formDate = ''; break;
    case 'cw-show': S.revealed.add(id); render(); break;
    case 'sel-mode': S.sel.on = !S.sel.on; S.sel.ids.clear(); render(); break;
    case 'sel-done': S.sel.on = false; S.sel.ids.clear(); render(); break;
    case 'sel-all': { const all = S.visIds.length && S.visIds.every(x => S.sel.ids.has(x)); S.visIds.forEach(x => all ? S.sel.ids.delete(x) : S.sel.ids.add(x)); render(); break; }
    case 'bulk': bulkAction(el.dataset.op); break;
    case 'cal-day': S.calDay = S.calDay === el.dataset.d ? null : el.dataset.d; S.addMenu = false; render(); break;
    case 'cal-mv': { const [cy, cm] = S.calYM.split('-').map(Number); const dt = new Date(cy, cm - 1 + (+el.dataset.d), 1); S.calYM = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; S.calDay = null; render(); break; }
    case 'cal-today': { const t = new Date(); S.calYM = `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; S.calDay = todayStr(); render(); break; }
    case 'tv-start': openTwViewer(S.visIds.slice(), 0); break;
    case 'tv-open': { const ids = S.visIds.filter(x => S.items[x] && S.items[x].type === 'tweet'); openTwViewer(ids.includes(id) ? ids : [id], Math.max(0, ids.indexOf(id))); break; }
    case 'hq-next': { const qs = allQuotes(); if (qs.length > 1){ let q; do { q = qs[Math.floor(Math.random() * qs.length)]; } while (q.h.id === S.homeQ); S.homeQ = q.h.id; render(); } break; }
    case 'edit': { const it = S.items[id]; if (it) FORMS[it.type](it.pairId, id); break; }
    case 'trash': openTrash(); break;
    case 'au-sel': S.auSel = el.dataset.au || null; S.auType = 'all'; S.addMenu = false; render(); break;
    case 'au-new': auForm(S.route.pairId, null); break;
    case 'au-edit': auForm(S.route.pairId, el.dataset.au); break;
    case 'au-type': S.auType = el.dataset.t; render(); break;
    case 'au-filter': S.auFilter = el.dataset.au || null; render(); break;
    case 'series-sel': S.seriesSel = el.dataset.s || null; render(); { const t = $('.tabs-scroll'); if (t) t.scrollIntoView({block:'start'}); } break;
    case 'series-new': seriesForm(S.route.pairId, null); break;
    case 'series-edit': seriesForm(S.route.pairId, el.dataset.s); break;
    case 'hl-open': openReader(id, {hl: el.dataset.hl}); break;
    case 'hl-all': S.hlAll = !S.hlAll; render(); break;
    case 'reorder-start': S.reorder = {list: sortedPairs().map(([pid]) => pid), pins: Object.fromEntries(Object.entries(S.pairs).map(([pid, p]) => [pid, !!p.pinned]))}; render(); break;
    case 'reorder-cancel': S.reorder = null; render(); break;
    case 'reorder-done': saveReorder(); break;
    case 'reorder-move': { const l = S.reorder.list; const i = l.indexOf(id); const j = i + (+el.dataset.d); if (i >= 0 && j >= 0 && j < l.length){ [l[i], l[j]] = [l[j], l[i]]; render(); } break; }
    case 'reorder-pin': { S.reorder.pins[id] = !S.reorder.pins[id]; if (S.reorder.pins[id]){ const l = S.reorder.list; l.splice(l.indexOf(id), 1); l.unshift(id); } render(); break; }
    case 'lock-now': lockNow(); break;
    case 'delete': {
      const it = S.items[id]; if (!it) break;
      if (await confirmBox(`'${displayTitle(it)}' 기록을 휴지통으로 옮길까요?\n${TRASH_DAYS}일 안에는 휴지통에서 되살릴 수 있어요.`, '휴지통으로')) trashItem(id);
      break;
    }
    case 'fav': { const it = clone(S.items[id]); if (!it) break; it.fav = !it.fav; try { await put('items', id, it); } catch(e){} break; }
    case 'read': openReader(id); break;
    case 'open-check': checkDetail(id); break;
    case 'music': musicForm(S.route.pairId); break;
    case 'gh-save': ghSave().catch(() => {}); break;
    case 'gh-force': if (await confirmBox('다른 기기에서 저장한 내용을 이 브라우저 내용으로 덮어쓸까요?\n덮어쓴 내용은 GitHub 저장소 기록(커밋 내역)에서만 되찾을 수 있어요.', '덮어쓰기')) ghSave({force:true}).catch(() => {}); break;
    case 'gh-load': if (await confirmBox('이 브라우저의 기록을 GitHub에 저장된 기록으로 바꿀까요?' + (GH.cfg.dirty ? '\n이 브라우저에서 아직 저장 안 한 변경은 사라져요.' : ''), '불러오기', false)) ghLoad().catch(() => {}); break;
    case 'gh-note-x': S.ghNote = null; renderNote(); break;
    case 'gs-tab': GS_TAB[id] = +el.dataset.i; render(); break;
    case 'del-pair': trashPair(id || S.route.pairId); break;
    case 'lb': {
      const key = el.dataset.set; const itemId = key.split(':')[0]; const it = S.items[itemId];
      openLB(key, +el.dataset.i, it && it.type === 'photo' ? {title: it.title, desc: it.data.desc} : (key === 'wall' ? {} : null)); break;
    }
  }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'toggle-row'){
    const it = clone(S.items[el.dataset.id]); if (!it) return;
    const r = (it.data.rows||[]).find(x => x.id === el.dataset.row); if (!r) return;
    r.done = el.checked; it.updatedAt = new Date().toISOString();
    try { await put('items', el.dataset.id, it); } catch(err){ el.checked = !el.checked; }
  }
});
let qTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'gq'){ S.gq = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(render, 160); }
  if (e.target.id === 'pq'){ S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(render, 160); }
});
document.addEventListener('keydown', (e) => {
  if (RD && e.key === 'Escape' && !$('#modal-root').innerHTML){ const pn = $('#rd-panel'); if (pn && !pn.hidden) pn.hidden = true; else closeReader(); return; }
  if ($('#lb-root').innerHTML){
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowRight' && LB_STATE) LB_STATE.next();
    if (e.key === 'ArrowLeft' && LB_STATE) LB_STATE.prev();
    return;
  }
  if (e.key === 'Escape'){
    if ($('#confirm-root').innerHTML){ $('#confirm-root').innerHTML = ''; return; }
    if ($('#modal-root').innerHTML) closeModal();
    else if (S.addMenu){ S.addMenu = false; render(); }
  }
});
window.addEventListener('beforeunload', (e) => { if (ghReady() && GH.cfg.dirty && GH.cfg.auto){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => { const m = /^#p-([A-Za-z0-9]+)$/.exec(location.hash); if (m && S.pairs[m[1]] && S.route.pairId !== m[1]) go({view:'pair', pairId:m[1]}); });

/* ---------- start ---------- */
const m0 = /^#p-([A-Za-z0-9]+)$/.exec(location.hash);
if (m0) S.route = {view:'pair', pairId:m0[1]};
render();
boot();
})();
</script>
