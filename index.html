<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pair Archive · 자컾·페어 기록을 페어별로 모아 두는 백업 사이트">
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Pair Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&family=Gaegu:wght@400;700&family=Jua&display=swap">
<style>
/* Layout: a binder shelf — pair cards on the home shelf; each pair opens as its own themed binder with index tabs */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --sunk:#E2E5EC; --ink:#1B1D26; --muted:#5F6576; --line:#D3D7E0;
  --brand:#2D5B87; --danger:#B83A33; --ok:#2B7F55; --scrim:rgba(18,20,28,.55);
  --f-display:'Hahmlet','Noto Serif KR','Apple SD Gothic Neo',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13151B; --surface:#1C1F27; --sunk:#252933; --ink:#E8EAF0; --muted:#9BA1B2; --line:#30353F;
    --brand:#8DB4DE; --danger:#EC726A; --ok:#5DC28E; --scrim:rgba(0,0,0,.66); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13151B; --surface:#1C1F27; --sunk:#252933; --ink:#E8EAF0; --muted:#9BA1B2; --line:#30353F;
  --brand:#8DB4DE; --danger:#EC726A; --ok:#5DC28E; --scrim:rgba(0,0,0,.66); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--surface)}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
h1,h2,h3{text-wrap:balance; margin:0}
.wrap{padding-left:var(--gutter-l); padding-right:var(--gutter-r); max-width:1240px; margin:0 auto}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:18px; height:18px; flex:none; display:inline-block; vertical-align:-3px}

/* top bar */
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:12px; min-height:56px; padding-block:8px}
.brand{font-family:var(--f-display); font-weight:700; font-size:18px; letter-spacing:-.01em; background:none; border:0; padding:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.crumb{display:flex; align-items:center; gap:8px; min-width:0; flex:1}
.crumb .sep{color:var(--muted)}
.crumb .here{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.top-actions{display:flex; gap:6px; margin-left:auto}
.iconbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; min-width:36px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface)}
.iconbtn:hover{background:var(--sunk)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:500; white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line))}
.btn.small{height:32px; padding:0 10px; font-size:13px; border-radius:8px}
.btn[disabled]{opacity:.5; cursor:default}
.banner-note{background:color-mix(in srgb, var(--brand) 12%, var(--surface)); border-bottom:1px solid var(--line); font-size:13px}
.banner-note .wrap{padding-block:8px}

/* home */
.home{padding-block:28px 64px; display:flex; flex-direction:column; gap:24px}
.home-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px}
.home-head h1{font-family:var(--f-display); font-size:clamp(28px, 5vw, 40px); font-weight:700; letter-spacing:-.02em; line-height:1.15}
.home-head p{margin:6px 0 0; color:var(--muted); max-width:60ch}
.stat-row{display:flex; gap:18px; font-size:13px; color:var(--muted)}
.stat-row b{display:block; font-family:var(--f-mono); font-size:20px; color:var(--ink); font-weight:500}
.search{display:flex; align-items:center; gap:8px; height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface)}
.search input{border:0; outline:0; background:none; flex:1; min-width:0; height:100%}
.search:focus-within{border-color:var(--brand)}
.shelf{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap:18px}
.paircard{display:flex; flex-direction:column; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; padding:0; transition:transform .15s ease, box-shadow .15s ease}
.paircard:hover{transform:translateY(-2px); box-shadow:0 10px 26px -14px rgba(0,0,0,.35)}
.paircard .cover{aspect-ratio:16/8; max-width:100%; background:linear-gradient(115deg, var(--c1) 0 50%, var(--c2) 50% 100%); background-size:cover; background-position:center; position:relative}
.paircard .cover.img{background-image:var(--cimg)}
.paircard .dd{position:absolute; right:10px; top:10px; font-family:var(--f-mono); font-size:12px; padding:2px 8px; border-radius:99px; background:var(--surface); color:var(--ink)}
.paircard .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px}
.paircard h3{font-family:var(--f-display); font-size:20px; font-weight:600; line-height:1.3}
.names{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; background:var(--dc); flex:none}
.counts{font-family:var(--f-mono); font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:10px}
.addcard{border:1.5px dashed var(--line); border-radius:16px; background:none; min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--muted)}
.addcard:hover{border-color:var(--brand); color:var(--brand)}
.empty{border:1.5px dashed var(--line); border-radius:16px; padding:40px 20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px}
.empty h2{font-family:var(--f-display); font-size:22px}
.empty p{margin:0; color:var(--muted); max-width:46ch}
.results{display:flex; flex-direction:column; gap:8px}
.result{display:flex; gap:12px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); width:100%}
.result:hover{border-color:var(--brand)}
.result .r-main{min-width:0; flex:1}
.result .r-title{font-weight:600}
.result .r-ex{color:var(--muted); font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--sunk); color:var(--muted); white-space:nowrap}

/* pair view */
.pairview{--c1:#6C8CD5; --c2:#E58FA8; --acc:var(--c1); --pf:var(--f-body); --tf:var(--pf); --rad:14px; --fs:15px; --gapx:16px; --bandH:150px; --patA:30%; --tint:11%; --base:var(--bg); --card-bg:var(--surface); --card-line:var(--line);
  min-height:100%; padding-bottom:64px; font-family:var(--pf); font-size:var(--fs); background:var(--base)}
.pairview.bg-soft{background:linear-gradient(170deg, color-mix(in srgb, var(--c1) var(--tint), var(--base)) 0%, var(--base) 45%, color-mix(in srgb, var(--c2) var(--tint), var(--base)) 100%)}
.pairview.bg-dots{background-color:var(--base); background-image:radial-gradient(color-mix(in srgb, var(--acc) var(--patA), transparent) 1.2px, transparent 1.4px); background-size:18px 18px}
.pairview.bg-lines{background-color:var(--base); background-image:repeating-linear-gradient(to bottom, transparent 0 27px, color-mix(in srgb, var(--acc) var(--patA), transparent) 27px 28px)}
.pairview.bg-grid{background-color:var(--base); background-image:linear-gradient(color-mix(in srgb, var(--acc) var(--patA), transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--acc) var(--patA), transparent) 1px, transparent 1px); background-size:24px 24px}
.pairview.bg-check{background-color:var(--base); background-image:conic-gradient(color-mix(in srgb, var(--c1) var(--patA), transparent) 25%, transparent 0 50%, color-mix(in srgb, var(--c2) var(--patA), transparent) 0 75%, transparent 0); background-size:44px 44px}
.pairview.bg-stripe{background-color:var(--base); background-image:repeating-linear-gradient(135deg, color-mix(in srgb, var(--acc) var(--patA), transparent) 0 10px, transparent 10px 26px)}
.pairview.bg-image{background:linear-gradient(color-mix(in srgb, var(--base) 84%, transparent), color-mix(in srgb, var(--base) 84%, transparent)), var(--bgimg) center/cover fixed, var(--base)}
.pairview.bg-plain{background:var(--base)}
.pv-band{height:var(--bandH); background:linear-gradient(115deg, var(--c1) 0 50%, var(--c2) 50% 100%)}
.band-vert .pv-band{background:linear-gradient(90deg, var(--c1) 0 50%, var(--c2) 50% 100%)}
.band-stripe .pv-band{background:repeating-linear-gradient(135deg, var(--c1) 0 24px, var(--c2) 24px 48px)}
.band-grad .pv-band{background:linear-gradient(120deg, var(--c1), var(--c2))}
.band-solid .pv-band{background:var(--acc)}
.band-check .pv-band{background:conic-gradient(var(--c1) 25%, var(--c2) 0 50%, var(--c1) 0 75%, var(--c2) 0) 0 0/48px 48px}
.band-dots .pv-band{background:radial-gradient(color-mix(in srgb, var(--c2) 85%, transparent) 5px, transparent 5.5px) 0 0/26px 26px, var(--c1)}
.pairview .pv-band.cover{height:calc(var(--bandH) + 70px); background:var(--cimg) center/cover, linear-gradient(115deg, var(--c1), var(--c2))}
.pairview.glass .card, .pairview.glass .pv-head:not(.minimal){backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
.pv-head:not(.minimal){background:var(--card-bg)}
.deco{color:var(--acc); font-weight:400; margin:0 .25em}
.tagline{margin:4px 0 0; color:color-mix(in srgb, var(--acc) 70%, var(--ink)); font-weight:600; letter-spacing:.02em}
.pv-head{position:relative; margin-top:-64px; background:var(--surface); border:1px solid var(--line); border-radius:calc(var(--rad) + 4px); padding:20px 22px; display:flex; flex-wrap:wrap; gap:16px 24px; align-items:flex-end; justify-content:space-between}
.pv-head.minimal{margin-top:24px; background:none; border:0; padding:0}
.pv-title{min-width:0; flex:1 1 320px}
.pv-title h1{font-family:var(--tf); font-size:clamp(26px, 4.5vw, 38px); font-weight:700; letter-spacing:-.015em; line-height:1.2; margin-top:6px}
.pv-title .intro{margin:8px 0 0; color:var(--muted); max-width:62ch; white-space:pre-wrap}
.pv-meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.ddbadge{font-family:var(--f-mono); font-size:13px; padding:3px 10px; border-radius:99px; background:color-mix(in srgb, var(--acc) 18%, var(--surface)); color:color-mix(in srgb, var(--acc) 60%, var(--ink)); border:1px solid color-mix(in srgb, var(--acc) 35%, var(--line))}
.pv-actions{display:flex; flex-wrap:wrap; gap:8px}
.tabs-scroll{overflow-x:auto; margin-top:22px; scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex; gap:4px; border-bottom:2px solid color-mix(in srgb, var(--acc) 45%, var(--line)); min-width:max-content}
.tab{border:1px solid transparent; border-bottom:0; background:none; padding:9px 16px 8px; border-radius:10px 10px 0 0; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:6px; white-space:nowrap}
.tab .n{font-family:var(--f-mono); font-size:11px; opacity:.8}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--acc); color:var(--on-acc); border-color:var(--acc)}
.tabs-pill .tabs{border-bottom:0; gap:6px}
.tabs-pill .tab{border:1px solid var(--line); border-radius:99px; background:var(--surface); padding:7px 16px}
.tabs-pill .tab.on{background:var(--acc); border-color:var(--acc)}
.tabs-under .tabs{border-bottom:1px solid var(--line); gap:8px}
.tabs-under .tab{border:0; border-radius:0; border-bottom:3px solid transparent; padding:9px 6px 7px; margin-bottom:-1px}
.tabs-under .tab.on{background:none; color:var(--ink); border-bottom-color:var(--acc); font-weight:700}
.tabs-sticker .tabs{border-bottom:0; gap:8px; padding:4px 2px}
.tabs-sticker .tab{border:1.5px solid var(--ink); border-radius:8px; background:var(--surface); color:var(--ink); box-shadow:2px 2px 0 var(--ink); padding:6px 14px}
.tabs-sticker .tab.on{background:var(--acc); color:var(--on-acc); transform:translate(1px, 1px); box-shadow:1px 1px 0 var(--ink)}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:16px 0 18px}
.toolbar .search{height:38px; flex:1 1 220px; border-radius:10px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:-6px 0 16px}
.chip{font-size:13px; padding:3px 10px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--muted)}
.chip.on{background:color-mix(in srgb, var(--acc) 20%, var(--surface)); border-color:var(--acc); color:var(--ink)}
.toggle.on{border-color:var(--acc); background:color-mix(in srgb, var(--acc) 16%, var(--surface))}
.addwrap{position:relative}
.addmenu{position:absolute; right:0; top:calc(100% + 6px); z-index:15; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px; display:flex; flex-direction:column; min-width:170px; box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
.addmenu button{text-align:left; border:0; background:none; padding:9px 12px; border-radius:8px; display:flex; gap:8px; align-items:center}
.addmenu button:hover{background:var(--sunk)}

/* feed */
.feed{--gap:var(--gapx)}
.feed.layout-masonry{columns:3 290px; column-gap:var(--gap)}
.cols-1 .feed.layout-masonry{columns:1} .cols-2 .feed.layout-masonry{columns:2} .cols-3 .feed.layout-masonry{columns:3} .cols-4 .feed.layout-masonry{columns:4}
.cols-1 .feed.layout-grid{grid-template-columns:1fr} .cols-2 .feed.layout-grid{grid-template-columns:repeat(2, minmax(0, 1fr))} .cols-3 .feed.layout-grid{grid-template-columns:repeat(3, minmax(0, 1fr))} .cols-4 .feed.layout-grid{grid-template-columns:repeat(4, minmax(0, 1fr))}
.feed.layout-masonry > *{break-inside:avoid; margin-bottom:var(--gap)}
.feed.layout-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap:var(--gap); align-items:start}
.feed.layout-list{display:flex; flex-direction:column; gap:var(--gap); max-width:680px; margin:0 auto}
.month{display:flex; align-items:baseline; gap:12px; margin:26px 0 12px}
.month:first-child{margin-top:4px}
.month h2{font-family:var(--pf); font-size:20px; font-weight:700}
.month .line{flex:1; height:1px; background:color-mix(in srgb, var(--acc) 40%, var(--line))}
.month .mono{font-size:12px; color:var(--muted)}

.card{background:var(--card-bg); border-radius:var(--rad); overflow:hidden; display:flex; flex-direction:column; min-width:0}
.cs-border .card{border:1px solid var(--card-line)}
.cs-shadow .card{box-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px -12px rgba(0,0,0,.28)}
.cs-flat .card{background:color-mix(in srgb, var(--acc) 7%, var(--surface))}
.cs-tape .card{border:1px solid var(--line); position:relative; overflow:visible}
.cs-tape .card::before{content:""; position:absolute; top:-8px; left:50%; width:74px; height:18px; transform:translateX(-50%) rotate(-3deg); background:color-mix(in srgb, var(--acc) 45%, transparent); border-radius:2px}
.cs-tape .card > :first-child{border-radius:var(--rad) var(--rad) 0 0}
.card-body{padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-width:0}
.card-title{font-weight:700; font-size:16px; line-height:1.35; word-break:break-word}
.card-desc{white-space:pre-wrap; word-break:break-word; color:var(--ink); font-size:14px}
.card-desc.clamp{display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden}
.card-foot{display:flex; align-items:center; gap:8px; padding:10px 12px 10px 16px; border-top:1px solid var(--line); font-size:12px; color:var(--muted)}
.card-foot .tags{display:flex; flex-wrap:wrap; gap:4px; min-width:0; flex:1}
.card-foot .tg{color:color-mix(in srgb, var(--acc) 65%, var(--ink))}
.card-foot .acts{display:flex; gap:2px; margin-left:auto}
.mini{border:0; background:none; width:30px; height:30px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted)}
.mini:hover{background:var(--sunk); color:var(--ink)}
.mini.fav-on{color:#D99A1E}
.typetag{font-size:11px; font-weight:600; letter-spacing:.06em; color:color-mix(in srgb, var(--acc) 70%, var(--ink))}

/* photos */
.collage{display:grid; gap:2px; background:var(--line)}
.collage.n1{grid-template-columns:1fr}
.collage.n2{grid-template-columns:1fr 1fr}
.collage.n3{grid-template-columns:2fr 1fr; grid-template-rows:1fr 1fr}
.collage.n3 > :first-child{grid-row:span 2}
.collage.n4{grid-template-columns:1fr 1fr}
.collage button{border:0; padding:0; display:block; position:relative; background:var(--sunk); aspect-ratio:1; max-width:100%; overflow:hidden}
.collage.n1 button{aspect-ratio:auto; max-height:520px}
.collage.n3 > button:first-child{aspect-ratio:auto}
.collage img{width:100%; height:100%; object-fit:cover; display:block}
.collage.n1 img{height:auto; max-height:520px}
.collage .more{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--scrim); color:#fff; font-family:var(--f-mono); font-size:20px}

/* tweets */
.tweets{padding:14px 16px 4px}
.tw{display:flex; gap:12px; min-width:0}
.tw-side{display:flex; flex-direction:column; align-items:center; flex:none}
.tw-line{flex:1; width:2px; background:var(--line); margin:4px 0 2px; min-height:12px}
.av{width:42px; height:42px; border-radius:50%; object-fit:cover; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--on); background:var(--avc); font-size:16px; overflow:hidden}
.av.sm{width:22px; height:22px; font-size:11px}
.tw-main{min-width:0; flex:1; padding-bottom:12px}
.tw-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:0 6px; line-height:1.3}
.tw-head b{font-weight:700}
.tw-handle{color:var(--muted); font-size:14px; font-family:var(--f-body)}
.tw-reply{font-size:13px; color:var(--muted); margin-top:2px}
.tw-reply span{color:var(--brand)}
.tw-text{white-space:pre-wrap; word-break:break-word; margin-top:4px; font-size:15px; line-height:1.55}
.tw-text a,.tw-text .mention,.tw-text .hashtag{color:var(--brand); text-decoration:none}
.tw-media{margin-top:10px; border-radius:14px; overflow:hidden; border:1px solid var(--line)}
.tw-media .collage{background:var(--line)}
.tw-quote{margin-top:10px; border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:4px}
.tw-quote .tw-head{align-items:center}
.tw-quote .tw-text{font-size:14px; margin-top:0}
.tw-quote .tw-media{margin-top:6px; border-radius:10px}
.tw-time{margin-top:8px; font-size:13px; color:var(--muted)}
.tw-note{margin:0 16px 12px; padding:8px 12px; border-radius:10px; background:var(--sunk); font-size:13px; white-space:pre-wrap}

/* text */
.excerpt{white-space:pre-wrap; word-break:break-word; color:var(--muted); font-size:14px; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden}
.text-meta{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:var(--muted)}
.card-btns{display:flex; flex-wrap:wrap; gap:6px}

/* checklist */
.progress{height:6px; border-radius:99px; background:var(--sunk); overflow:hidden}
.progress span{display:block; height:100%; background:var(--acc); border-radius:99px}
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.checks li{display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-bottom:1px dashed var(--line)}
.checks li:last-child{border-bottom:0}
.checks input{width:18px; height:18px; margin-top:3px; accent-color:var(--acc); flex:none}
.checks .done{color:var(--muted); text-decoration:line-through}
.checks label{word-break:break-word; min-width:0; flex:1}
.sheetlink{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); text-decoration:none; font-size:13px; min-width:0}
.sheetlink:hover{border-color:var(--acc)}
.sheetlink .u{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1}
.sheet-ico{width:28px; height:28px; border-radius:7px; background:#1E8E55; color:#fff; display:flex; align-items:center; justify-content:center; flex:none}

/* profile */
.profile-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:16px}
.char{background:var(--surface); border:1px solid var(--line); border-radius:var(--rad); overflow:hidden}
.char .cbar{height:8px; background:var(--cc)}
.char .cin{padding:16px; display:flex; flex-direction:column; gap:10px}
.char .chead{display:flex; gap:12px; align-items:center}
.char .av{width:64px; height:64px; font-size:24px}
.char h3{font-size:20px; font-family:var(--pf)}
.char .prof{white-space:pre-wrap; word-break:break-word; font-size:14px}
.swatch{font-family:var(--f-mono); font-size:12px; display:inline-flex; gap:6px; align-items:center; color:var(--muted)}

/* modal */
.layer{position:fixed; inset:0; z-index:50; background:var(--scrim); display:flex; align-items:center; justify-content:center; padding:max(16px, env(safe-area-inset-top, 0px)) var(--gutter-r) max(16px, env(safe-area-inset-bottom, 0px)) var(--gutter-l)}
.modal{background:var(--surface); color:var(--ink); border-radius:18px; width:min(640px, 100%); max-height:100%; display:flex; flex-direction:column; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); font-family:var(--f-body)}
.modal.wide{width:min(860px, 100%)}
.layer.drawer{justify-content:flex-end; padding:0; background:transparent; pointer-events:none}
.layer.drawer .modal{pointer-events:auto; height:100%; max-height:none; width:min(400px, 100%); border-radius:0; border-left:1px solid var(--line); padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); padding-right:env(safe-area-inset-right, 0px)}
.m-head{display:flex; align-items:center; gap:10px; padding:16px 18px 12px; border-bottom:1px solid var(--line)}
.m-head h2{font-size:18px; font-weight:700; flex:1; min-width:0}
.m-body{padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; min-height:0}
.m-foot{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; padding:12px 18px 16px; border-top:1px solid var(--line)}
.m-foot .left{margin-right:auto}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field > label, .flabel{font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--muted)}
.field input[type=text], .field input[type=url], .field input[type=date], .field input[type=datetime-local], .field textarea, .field select, .inp{width:100%; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:9px 12px; min-height:40px}
.field textarea{resize:vertical; line-height:1.6}
.field input:focus, .field textarea:focus, .field select:focus, .inp:focus{outline:2px solid color-mix(in srgb, var(--brand) 50%, transparent); outline-offset:0; border-color:var(--brand)}
.row2{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap:12px}
.hint{font-size:12px; color:var(--muted)}
.check-inline{display:flex; gap:8px; align-items:center; font-size:14px}
.drop{border:1.5px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--muted); font-size:14px}
.drop.over{border-color:var(--brand); background:color-mix(in srgb, var(--brand) 8%, transparent)}
.linkbtn{color:var(--brand); text-decoration:underline; cursor:pointer; background:none; border:0; padding:0}
.imgedit{display:flex; flex-direction:column; gap:10px}
.imgrow{display:flex; gap:10px; align-items:flex-start; padding:8px; border:1px solid var(--line); border-radius:12px}
.imgrow img{width:84px; height:84px; object-fit:cover; border-radius:8px; flex:none; background:var(--sunk)}
.imgrow textarea{flex:1; min-width:0; min-height:84px; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:8px 10px; resize:vertical}
.imgrow .ops{display:flex; flex-direction:column; gap:2px}
.thumbs{display:flex; flex-wrap:wrap; gap:6px}
.thumb{position:relative; width:64px; height:64px}
.thumb img{width:100%; height:100%; object-fit:cover; border-radius:8px}
.thumb button{position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; padding:0}
.twblock{border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; background:color-mix(in srgb, var(--sunk) 35%, var(--surface))}
.twblock .tb-head{display:flex; align-items:center; gap:8px}
.twblock .tb-head b{flex:1}
.qblock{border-left:3px solid var(--brand); padding-left:12px; display:flex; flex-direction:column; gap:10px}
.charedit{border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px}
.charedit .ch-top{display:flex; gap:10px; align-items:center}
.charedit input[type=color], .colorin{width:44px; height:40px; padding:2px; border:1px solid var(--line); border-radius:10px; background:var(--bg); flex:none}
.avpick{width:52px; height:52px; border-radius:50%; overflow:hidden; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; flex:none; background:var(--bg); cursor:pointer}
.avpick img{width:100%; height:100%; object-fit:cover}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:7px 12px; font-size:13px}
.seg button.on{border-color:var(--brand); background:color-mix(in srgb, var(--brand) 14%, var(--surface)); font-weight:600}
.fontopt{font-size:15px !important}
.section-h{font-size:13px; font-weight:700; padding-top:4px; border-top:1px solid var(--line); margin-top:4px; padding-top:14px}
.storage .bar{height:8px; background:var(--sunk); border-radius:99px; overflow:hidden; margin-top:6px}
.storage .bar span{display:block; height:100%; background:var(--brand)}

/* reader */
.reader{font-family:var(--pf); max-width:62ch; margin:0 auto; width:100%}
.reader h1{font-size:26px; font-weight:700; line-height:1.3}
.reader .rmeta{margin:8px 0 22px; font-size:13px; color:var(--muted); font-family:var(--f-body)}
.reader .rbody p{margin:0 0 .2em; line-height:1.9; font-size:16px; word-break:break-word}
.reader .rbody p.gap{height:.9em}

/* lightbox */
.lb{position:fixed; inset:0; z-index:60; background:rgba(8,9,12,.92); display:flex; flex-direction:column; padding:env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); color:#F2F3F6}
.lb-top{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-family:var(--f-mono); font-size:13px}
.lb-top button,.lb-nav{background:rgba(255,255,255,.12); color:#F2F3F6; border:0; border-radius:10px; height:38px; min-width:38px; display:inline-flex; align-items:center; justify-content:center}
.lb-stage{flex:1; display:flex; align-items:center; justify-content:center; gap:10px; min-height:0; padding:0 10px}
.lb-stage img{max-width:100%; max-height:100%; object-fit:contain; min-width:0}
.lb-cap{padding:12px 18px 18px; max-width:760px; margin:0 auto; width:100%; white-space:pre-wrap; font-size:14px; line-height:1.6; max-height:28vh; overflow-y:auto}
.lb-cap .t{font-weight:700; margin-bottom:4px}

.toast{position:fixed; left:50%; bottom:max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:12px; font-size:14px; z-index:80; max-width:calc(100% - 32px); box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.loading{padding:80px 16px; text-align:center; color:var(--muted)}
.ro-note{font-size:12px; color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* PDF render target — a print sheet, always ink on paper regardless of theme */
.pdf-doc{--paper:#FFFFFF; --pink:#16171C; background:var(--paper); color:var(--pink); padding:0; line-height:1.85}
.pdf-doc h1{font-size:1.6em; line-height:1.3; margin:0 0 .3em}
.pdf-doc .pm{font-size:.8em; opacity:.6; margin-bottom:1.6em; font-family:var(--f-body)}
.pdf-doc p{margin:0; word-break:break-word}
.pdf-doc p.gap{height:.9em}

/* tweets (text only) */
.tw2{padding:14px 16px; display:flex; flex-direction:column; gap:8px; min-width:0}
.tw2 + .tw2{border-top:1px dashed var(--line)}
.tw2 .tw-text{margin-top:0}
.tw-idx{font-family:var(--f-mono); font-size:11px; color:var(--muted)}
.tw-lbl{font-size:11px; font-weight:600; letter-spacing:.05em; color:color-mix(in srgb, var(--acc) 65%, var(--ink))}
.tw-ctx{border-left:3px solid color-mix(in srgb, var(--acc) 40%, var(--line)); padding:2px 0 2px 12px; display:flex; flex-direction:column; gap:2px}
.tw-ctx .tw-text{font-size:14px; color:var(--muted)}
.tw2 .tw-quote{margin-top:2px}

/* pair checklist */
.pcl-wrap{overflow-x:auto}
.pcl{width:100%; border-collapse:collapse; font-size:14px}
.pcl th{font-size:12px; font-weight:600; color:var(--muted); text-align:center; padding:6px; border-bottom:2px solid color-mix(in srgb, var(--acc) 40%, var(--line)); white-space:nowrap}
.pcl th:first-child{text-align:left}
.pcl th .dot{margin-right:4px}
.pcl td{padding:7px 6px; border-bottom:1px dashed var(--line); vertical-align:top}
.pcl td.q{word-break:break-word; min-width:9em}
.pcl td.q .nt{display:block; font-size:12px; color:var(--muted); white-space:pre-wrap; margin-top:2px}
.pcl td.mk{text-align:center; width:3.4em}
.pcl .box{background:transparent; display:inline-flex; width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line); align-items:center; justify-content:center; color:transparent}
.pcl .box.on{background:var(--cc); border-color:var(--cc); color:var(--on)}
.pcl .box svg{width:14px; height:14px}
.pcl tr.sec td{font-weight:700; padding-top:14px; border-bottom:1px solid var(--line); color:color-mix(in srgb, var(--acc) 70%, var(--ink))}
.pcl-credit{font-size:12px; color:var(--muted)}
.sheets{display:flex; flex-direction:column; gap:6px}
.rowed{display:flex; flex-direction:column; gap:6px}
.re{display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:6px; border:1px solid var(--line); border-radius:10px; background:var(--bg)}
.re.sec{background:color-mix(in srgb, var(--brand) 9%, var(--bg))}
.re .rq{flex:1 1 200px; min-width:0}
.re .rn{flex:1 1 140px; min-width:0}
.re .inp{min-height:34px; padding:6px 10px; background:var(--surface)}
.pk{border:1.5px solid var(--cc); background:transparent; color:var(--ink); border-radius:8px; height:34px; padding:0 10px; font-size:13px; white-space:nowrap; max-width:9em; overflow:hidden; text-overflow:ellipsis}
.pk[aria-pressed="true"]{background:var(--cc); color:var(--on)}
.sheet-ed{display:flex; gap:6px; flex-wrap:wrap}
.sheet-ed .inp{flex:1 1 160px; min-width:0}

/* reader */
.rd-layer{position:fixed; inset:0; z-index:55; display:flex; flex-direction:column; background:var(--rbg); color:var(--rfg)}
.rd-top{display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 8px var(--gutter-l); border-bottom:1px solid var(--rline); font-family:var(--f-body)}
.rd-top .t{flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px}
.rd-top button, .rd-top a{background:none; border:1px solid var(--rline); color:var(--rfg); border-radius:9px; height:34px; min-width:34px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; font-size:13px}
.rd-prog{height:3px; background:var(--rline)}
.rd-prog span{display:block; height:100%; background:var(--racc); width:0}
.rd-scroll{flex:1; overflow-y:auto; padding-block:36px calc(env(safe-area-inset-bottom, 0px) + 90px); padding-left:var(--gutter-l); padding-right:var(--gutter-r)}
.rd-doc{margin:0 auto; max-width:var(--rw); font-size:var(--rfs)}
.rd-doc h1{font-size:1.55em; line-height:1.3; margin-bottom:.4em}
.rd-doc .rmeta{font-size:13px; opacity:.65; margin-bottom:2.6em; font-family:var(--f-body)}
.rd-doc .rbody p{margin:0 0 var(--pgap); line-height:var(--lh); word-break:keep-all; overflow-wrap:anywhere}
.rd-doc.indent .rbody p{text-indent:1em}
.rd-doc.indent .rbody p.dl{text-indent:0}
.rd-doc .rbody p.scene{text-align:center; text-indent:0; margin:1.8em 0; letter-spacing:.3em; opacity:.7}
.rd-doc .rbody p.gap{height:.5em; margin:0}
.rd-end{text-align:center; margin-top:3.2em; opacity:.55; font-size:13px; font-family:var(--f-body)}
.rd-panel{position:absolute; right:var(--gutter-r); top:calc(env(safe-area-inset-top, 0px) + 58px); width:min(330px, calc(100% - 32px)); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 40px -16px rgba(0,0,0,.45); font-family:var(--f-body); z-index:2; max-height:70vh; overflow-y:auto}
.paper-default{--rbg:var(--surface); --rfg:var(--ink); --rline:var(--line); --racc:var(--brand)}
.paper-paper{--rbg:#FBFAF6; --rfg:#232327; --rline:#E2DFD6; --racc:#5A6B85; color-scheme:light}
.paper-sepia{--rbg:#F2E8D5; --rfg:#3A2E22; --rline:#D9C9AB; --racc:#8A6A3D; color-scheme:light}
.paper-night{--rbg:#111317; --rfg:#C8CCD4; --rline:#262A31; --racc:#7F9CC4; color-scheme:dark}
.resume{position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); transform:translateX(-50%); background:var(--ink); color:var(--surface); border-radius:99px; padding:6px 6px 6px 14px; display:flex; gap:8px; align-items:center; font-size:13px; font-family:var(--f-body); box-shadow:0 10px 24px -10px rgba(0,0,0,.5); white-space:nowrap}
.resume button{border:0; background:var(--surface); color:var(--ink); border-radius:99px; padding:4px 10px; font-size:12px}

/* polaroid cards */
.cs-polaroid .card{border:1px solid var(--line); padding:10px 10px 0; box-shadow:0 6px 18px -10px rgba(0,0,0,.35); border-radius:4px}
.cs-polaroid .card .collage{border-radius:2px; overflow:hidden}
.cs-polaroid .card .card-foot{margin:0 -10px}
.cs-polaroid .feed > .card:nth-child(3n+1){transform:rotate(-.7deg)}
.cs-polaroid .feed > .card:nth-child(3n+2){transform:rotate(.5deg)}

/* photo wall */
.wall{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(46%, 150px), 1fr)); gap:6px}
.wall button{border:0; padding:0; aspect-ratio:1; max-width:100%; overflow:hidden; border-radius:calc(var(--rad) / 2); background:var(--sunk)}
.wall img{width:100%; height:100%; object-fit:cover; display:block}

/* google sheet view (a light sheet surface on purpose, like the original) */
.gs{display:flex; flex-direction:column; gap:0; min-width:0}
.gs-wrap{overflow:auto; max-height:380px; border:1px solid var(--line); border-radius:8px; background:#FFFFFF; color:#1F1F1F; color-scheme:light; max-width:100%}
.gs-wrap.big{max-height:70vh}
.gs-wrap table{border-collapse:collapse; font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:13px; table-layout:auto}
.gs-wrap td, .gs-wrap th{border:1px solid #E2E3E3; padding:3px 7px; vertical-align:bottom; white-space:pre-wrap; min-width:24px; line-height:1.4}
.gs-wrap a{color:#1155CC}
.gs-box{display:inline-block; width:14px; height:14px; border:2px solid #5F6368; border-radius:2px; vertical-align:middle; position:relative}
.gs-box.on{background:#1A73E8; border-color:#1A73E8}
.gs-box.on::after{content:""; position:absolute; left:3px; top:0; width:4px; height:8px; border:solid #FFFFFF; border-width:0 2px 2px 0; transform:rotate(45deg)}
.gs-tabs{display:flex; gap:2px; overflow-x:auto; background:var(--sunk); border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px; padding:4px}
.gs-tabs button{border:0; background:none; padding:5px 12px; border-radius:6px; font-size:12px; white-space:nowrap; color:var(--muted)}
.gs-tabs button.on{background:var(--surface); color:color-mix(in srgb, var(--acc, var(--brand)) 70%, var(--ink)); font-weight:600}
.gs:has(.gs-tabs) .gs-wrap{border-radius:8px 8px 0 0}
.gs-paste{cursor:pointer; padding:22px 16px}
.gs-paste:focus{border-color:var(--brand); background:color-mix(in srgb, var(--brand) 8%, transparent); outline:none}
.pcwrap{position:relative; display:flex; flex-direction:column}
.pcwrap .paircard{flex:1}
.pc-del{position:absolute; left:10px; top:10px; z-index:2; width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--muted); display:flex; align-items:center; justify-content:center; opacity:.9}
.pc-del:hover{color:var(--danger); border-color:var(--danger)}

.gh-st.gh-dirty{border-color:var(--brand); color:var(--brand)}
.gh-st.gh-error{border-color:var(--danger); color:var(--danger)}
.gh-st.gh-saved{color:var(--ok)}

/* customize groups */
.czg{border-top:1px solid var(--line); padding-top:12px}
.czg summary{font-weight:700; font-size:14px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center}
.czg summary::-webkit-details-marker{display:none}
.czg summary::after{content:"+"; color:var(--muted); font-weight:400; font-size:18px}
.czg[open] summary::after{content:"−"}
.czb{display:flex; flex-direction:column; gap:14px; padding-top:12px}
.czb input[type=range]{width:100%; accent-color:var(--brand)}

/* photo folders */
.folders{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(46%, 170px), 1fr)); gap:14px 12px}
.fcard{display:flex; flex-direction:column; gap:4px; text-align:left; border:0; background:none; padding:0; min-width:0; color:var(--ink)}
.fcard:not(.add)::before{content:""; width:42%; height:10px; border-radius:7px 7px 0 0; background:color-mix(in srgb, var(--acc) 35%, var(--surface)); margin-bottom:-4px}
.fcard .fcover{aspect-ratio:4/3; max-width:100%; border-radius:4px var(--rad) var(--rad) var(--rad); overflow:hidden; background:color-mix(in srgb, var(--acc) 14%, var(--surface)); display:flex; align-items:center; justify-content:center; color:color-mix(in srgb, var(--acc) 70%, var(--ink)); border:1px solid color-mix(in srgb, var(--acc) 30%, var(--line))}
.fcard .fcover img{width:100%; height:100%; object-fit:cover; display:block}
.fcard .fcover .ico{width:34px; height:34px}
.fcard .fname{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:4px}
.fcard .fmeta{font-size:12px; color:var(--muted)}
.fcard:hover .fcover{border-color:var(--acc)}
.fcard.add{align-items:center; justify-content:center; border:1.5px dashed var(--line); border-radius:var(--rad); aspect-ratio:4/3; max-width:100%; color:var(--muted); margin-top:6px}
.fcard.add:hover{border-color:var(--acc); color:var(--ink)}
.folder-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.folder-head .fh-main{flex:1; min-width:0}
.folder-head h2{font-family:var(--pf); font-size:22px; display:flex; align-items:center; gap:8px}
.folder-head p{margin:2px 0 0; color:var(--muted); white-space:pre-wrap}
.grouplist{display:flex; flex-direction:column; gap:6px}
.grouprow{display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:14px}
.grouprow .gname{flex:1; min-width:0}

/* home extras */
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display); font-size:18px}
.memo-strip{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap:10px}
.ago{font-family:var(--f-mono); font-size:12px; color:var(--brand)}

@media (max-width:560px){
  .pairview{--bandH:110px !important}
  .pv-head{padding:16px; margin-top:-48px}

function errText(e){

  if (c === 'invalid_argument' || c === 'not_granted') return '이 페이지를 수정할 권한이 없어요. 보기만 할 수 있어요.';
  if (c === 'too_large') return '파일이 너무 커요. 20MB 이하로 줄여서 올려 주세요.';
  if (c === 'unsupported_type') return '지원하지 않는 파일 형식이에요. JPG, PNG, GIF, WEBP, PDF를 올려 주세요.';
  if (c === 'rate_limited' || c === 'resource_exhausted') return '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';
  if (c === 'no_assets') return '이 화면에서는 파일을 올릴 수 없어요. 편집 권한이 있는 계정으로 열어 주세요.';

}
/* standalone storage: IndexedDB for records and files, localStorage as a fallback */
const isStandalone = () => !(window.claude && typeof window.claude.use === 'function');
const LOCAL_URLS = {};
const IDB = {db:null};
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('jakeop-archive', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbDo(store, mode, fn){
  return new Promise((res, rej) => {
    const tx = IDB.db.transaction(store, mode); const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
let saveT = null;
function saveLocal(){

    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch(e){ toast('브라우저 저장 공간이 부족해요. 설정에서 백업 파일을 받아 두세요.'); }
  }, 250);
}
async function localBlob(ref){

  return null;
}
async function loadLocal(){
  let data = null;
  try { if (window.indexedDB) IDB.db = await idbOpen(); } catch(e){ IDB.db = null; }
  if (IDB.db){
    try { data = await idbDo('kv', 'readonly', s => s.get('state')); } catch(e){}
    try {
      const keys = await idbDo('files', 'readonly', s => s.getAllKeys());
      const vals = await idbDo('files', 'readonly', s => s.getAll());
      (keys || []).forEach((k, i) => { if (vals[i]) LOCAL_URLS[k] = URL.createObjectURL(vals[i]); });
    } catch(e){}
  }
  if (!data){ try { data = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){} }
  if (data && data.pairs){ S.pairs = data.pairs; S.items = data.items || {}; S.bodies = data.bodies || {}; S.site = {...DEFAULT_SITE, ...(data.site||{})}; }
  else { const s = sampleData(); S.pairs = s.pairs; S.items = s.items; }
}
async function put(col, id, data){
  const body = clone(data);
  if (B.remote){
    try { await B.db.collection(col).doc(id).set(body); }
    catch(e){ if (e && e.code === 'invalid_argument') S.canWrite = false; toast(errText(e)); schedule(); throw e; }
  } else {
    if (col === 'site') S.site = body; else localCol(col)[id] = body;
    saveLocal(); schedule(); ghMark();
  }
}
const localCol = (col) => col === 'pairs' ? S.pairs : col === 'bodies' ? S.bodies : S.items;
async function del(col, id){
  if (B.remote){
    try { await B.db.collection(col).doc(id).delete(); }
    catch(e){ toast(errText(e)); throw e; }
  } else { delete localCol(col)[id]; saveLocal(); schedule(); ghMark(); }
}
async function putBody(id, body, oldParts=1){
  const chunks = []; for (let i = 0; i < body.length; i += CHUNK) chunks.push(body.slice(i, i + CHUNK));
  if (!chunks.length) chunks.push('');
  for (let k = 1; k < chunks.length; k++) await put('bodies', `${id}_${k}`, {itemId:id, k, text:chunks[k]});
  for (let k = chunks.length; k < oldParts; k++) { try { await del('bodies', `${id}_${k}`); } catch(e){} }
  return {body:chunks[0], parts:chunks.length};
}
async function fullBody(id){
  const it = S.items[id]; const d = (it && it.data) || {}; const n = d.parts || 1;
  let s = d.body || ''; if (n <= 1) return s;
  for (let k = 1; k < n; k++){
    const key = `${id}_${k}`;
    if (B.remote){ const snap = await B.db.collection('bodies').doc(key).get(); s += snap.exists ? (snap.data().text || '') : ''; }
    else s += (S.bodies[key] || {}).text || '';

  return s;
}
function readAsDataURL(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
async function toJpeg(file, maxDim=4096, q=.9){
  const bmp = await createImageBitmap(file);
  let {width:w, height:h} = bmp; const k = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w*k); h = Math.round(h*k);
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return await new Promise(res => c.toBlob(res, 'image/jpeg', q));
}
async function normalizeFile(file, {localSmall=false}={}){
  const fm = /\.(woff2|woff|ttf|otf)$/i.exec(file.name || '');
  if (fm){ if (file.size > 20*1024*1024) throw {code:'too_large'}; return new File([file], file.name, {type:'font/' + fm[1].toLowerCase()}); }
  if (file.type === 'application/pdf'){ if (file.size > 20*1024*1024) throw {code:'too_large'}; return file; }
  let f = file;
  if (!ACCEPT_IMG.includes(file.type) || file.size > 19.5*1024*1024){
    try { f = await toJpeg(file); } catch(e){ throw {code:'unsupported_type'}; }
  }
  if (localSmall && f.size > 600*1024 && f.type !== 'image/gif'){ try { f = await toJpeg(f, 1600, .82); } catch(e){} }
  return f;
}
async function uploadFile(file){
  if (B.remote){
    if (!B.assets) throw {code:'no_assets'};
    const f = await normalizeFile(file);
    let r;
    try { r = await B.assets.upload(f, {type: f.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg')}); }
    catch(e){ if (e && e.code === 'store_unavailable'){ await new Promise(s => setTimeout(s, 900)); r = await B.assets.upload(f, {type:f.type}); } else throw e; }
    return r.id;
  }
  if (IDB.db){
    const f = await normalizeFile(file); const id = 'loc' + uid();
    await idbDo('files', 'readwrite', s => s.put(f, id));
    LOCAL_URLS[id] = URL.createObjectURL(f);
    return id;
  }

  return await readAsDataURL(f);
}
function collectRefs(obj, out=new Set()){
  if (!obj || typeof obj !== 'object') return out;
  if (Array.isArray(obj)){ obj.forEach(x => collectRefs(x, out)); return out; }
  for (const [k, v] of Object.entries(obj)){
    if (['ref','avatar','cover','bgImage','pdf'].includes(k) && typeof v === 'string' && v && !/^(data:|blob:)/.test(v)) out.add(v);
    else if (v && typeof v === 'object') collectRefs(v, out);
  }
  return out;
}
function mapRefs(obj, fn){
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(x => mapRefs(x, fn));
  const o = {};
  for (const [k, v] of Object.entries(obj)){
    if (['ref','avatar','cover','bgImage','pdf'].includes(k) && typeof v === 'string') o[k] = fn(v);
    else o[k] = (v && typeof v === 'object') ? mapRefs(v, fn) : v;
  }
  return o;
}
async function dropAssets(refs){
  if (!B.remote){
    if (!IDB.db) return;
    for (const r of refs){ if (!LOCAL_URLS[r]) continue; try { await idbDo('files', 'readwrite', s => s.delete(r)); URL.revokeObjectURL(LOCAL_URLS[r]); delete LOCAL_URLS[r]; } catch(e){} }
    return;
  }
  if (!B.assets) return;
  for (const r of refs){ try { await B.assets.delete(r); } catch(e){} }
}
async function saveFile(filename, data){
  const clean = filename.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'backup';
  if (!B.downloads && isStandalone()){
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = clean; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000); toast('파일을 저장했어요.'); return true;
  }
  if (!B.downloads){ toast('이 화면에서는 파일을 저장할 수 없어요. claude.ai에서 페이지를 열어 주세요.'); return false; }
  try { await B.downloads.save({filename: filename.replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'backup', data}); toast('파일을 저장했어요.'); return true; }

  B.db.collection('items').onSnapshot(s => { const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); S.items = o; S.got.items = true; ready(); }, onErr);
  B.db.doc('site/main').onSnapshot(d => { S.site = d.exists ? {...DEFAULT_SITE, ...d.data()} : {...DEFAULT_SITE}; schedule(); }, onErr);
}

function folderSection(p, items){

  const nImgs = (its) => its.reduce((n, it) => n + (it.data?.images || []).length, 0);

    const f = folders.find(x => x.id === S.photoFolder);

}
function qText(q){ return !q ? '' : typeof q === 'string' ? q : (q.text || ''); }
function threadHTML(it, p){
  const ts = it.data?.tweets || [];
  return ts.map((t, i) => tweetHTML(t, `${it.id}:${i}`, ts.length > 1 ? `${i + 1}/${ts.length}` : '')).join('');
}
function tweetHTML(t, key, idx){

}
function profileView(pid, p){

/* ---------- modal ---------- */
let modalCleanup = null;
function openModal({title, body, foot='', wide=false, drawer=false, onMount, onClose}){
  closeModal(true);
  const r = $('#modal-root');
  r.innerHTML = `<div class="layer ${drawer ? 'drawer' : ''}" id="m-layer"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="${!drawer}" aria-labelledby="m-title">
    <div class="m-head"><h2 id="m-title">${esc(title)}</h2><button class="mini" id="m-x" aria-label="닫기">${I.x}</button></div>
    <div class="m-body" id="m-body">${body}</div>${foot ? `<div class="m-foot" id="m-foot">${foot}</div>` : ''}</div></div>`;
  const layer = $('#m-layer');
  modalCleanup = onClose || null;
  $('#m-x').onclick = () => closeModal();
  if (!drawer) layer.addEventListener('mousedown', e => { if (e.target === layer) closeModal(); });
  if (onMount) onMount($('#m-layer'));
  const first = $('#m-body input, #m-body textarea, #m-body select', r); if (first && !drawer) setTimeout(() => first.focus({preventScroll:true}), 30);
}
function closeModal(silent){
  const r = $('#modal-root'); if (!r.innerHTML) return;
  r.innerHTML = '';
  const c = modalCleanup; modalCleanup = null; if (c && !silent) c(); else if (c && silent) c();
}
function setBusy(btn, label){ if (!btn) return; if (label){ btn.dataset.l = btn.innerHTML; btn.innerHTML = esc(label); btn.disabled = true; } else { btn.innerHTML = btn.dataset.l || btn.innerHTML; btn.disabled = false; } }

function commonFields(it){
  return `<div class="row2">
    <div class="field"><label for="f-date">날짜</label><input type="date" id="f-date" value="${esc(it?.date || todayStr())}"></div>
    <div class="field"><label for="f-tags">태그</label><input type="text" id="f-tags" placeholder="쉼표로 구분 · 예: 연성, 커미션" value="${esc((it?.tags||[]).join(', '))}"></div>
  </div>
  <label class="check-inline"><input type="checkbox" id="f-fav" ${it?.fav ? 'checked' : ''}>즐겨찾기에 넣기</label>`;
}
function readCommon(root){ return {date: $('#f-date', root).value || todayStr(), tags: parseTags($('#f-tags', root).value), fav: $('#f-fav', root).checked}; }
function baseItem(pairId, type, old){
  const now = new Date().toISOString();
  return {pairId, type, title:'', date:'', tags:[], fav:false, createdAt: old?.createdAt || now, updatedAt: now, data:{}};
}
function bindDrop(zone, input, onFiles){
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); onFiles(Array.from(e.dataTransfer.files || [])); });
  input.addEventListener('change', () => { onFiles(Array.from(input.files || [])); input.value = ''; });
}
async function uploadPending(list, btn, counter){
  for (const x of list){
    if (x.file){
      counter.n++; setBusy(btn); setBusy(btn, `올리는 중 ${counter.n}/${counter.total}`);
      x.ref = await uploadFile(x.file); delete x.file; if (x.preview) URL.revokeObjectURL(x.preview); delete x.preview;
    }
  }
}
function countPending(arr){ return arr.filter(x => x && x.file).length; }

function folderOptions(p, sel){
  return `<option value="">미분류</option>${(p.folders || []).map(f => `<option value="${esc(f.id)}" ${sel === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}<option value="_new">+ 새 폴더 만들기</option>`;
}
async function ensureFolder(pairId, name){
  name = (name || '').trim(); if (!name) return '';
  const p = clone(S.pairs[pairId]); p.folders = p.folders || [];
  const ex = p.folders.find(f => f.name === name); if (ex) return ex.id;
  const f = {id: uid(), name, desc: ''}; p.folders.push(f);
  await put('pairs', pairId, p); S.pairs[pairId] = p;
  return f.id;
}
function folderForm(pairId, fid){
  const p = S.pairs[pairId]; const f = fid ? (p.folders || []).find(x => x.id === fid) : null;
  openModal({title: f ? '폴더 수정' : '새 폴더', body:`
    <div class="field"><label for="fd-name">폴더 이름 (카테고리)</label><input type="text" id="fd-name" placeholder="예: 커미션, 합작, 연성 낙서, 스크린샷" value="${esc(f?.name || '')}"></div>
    <div class="field"><label for="fd-desc">설명 (선택)</label><textarea id="fd-desc" rows="3">${esc(f?.desc || '')}</textarea></div>`,
    foot:`${f ? `<button class="btn danger left" id="fd-del">${I.trash}폴더 지우기</button>` : ''}<button class="btn" data-m="cancel">취소</button><button class="btn primary" id="fd-save">저장</button>`,
    onMount(root){
      $('[data-m=cancel]', root).onclick = () => closeModal();
      const dl = $('#fd-del', root);
      if (dl) dl.onclick = async () => {
        if (!await confirmBox(`'${f.name}' 폴더를 지울까요?\n안에 있던 사진은 지워지지 않고 미분류로 옮겨져요.`, '폴더 지우기')) return;
        const np = clone(S.pairs[pairId]); np.folders = (np.folders || []).filter(x => x.id !== fid);
        try { await put('pairs', pairId, np); S.photoFolder = null; closeModal(); toast('폴더를 지웠어요.'); } catch(e){}
      };
      $('#fd-save', root).onclick = async () => {
        const name = $('#fd-name', root).value.trim(); if (!name){ toast('폴더 이름을 적어 주세요.'); return; }
        const np = clone(S.pairs[pairId]); np.folders = np.folders || [];
        if (np.folders.some(x => x.name === name && x.id !== fid)){ toast('같은 이름의 폴더가 이미 있어요.'); return; }
        if (f){ const t = np.folders.find(x => x.id === fid); t.name = name; t.desc = $('#fd-desc', root).value; }
        else np.folders.push({id: uid(), name, desc: $('#fd-desc', root).value});
        try { await put('pairs', pairId, np); closeModal(); toast('폴더를 저장했어요.'); } catch(e){}
      };
    }});
}

/* ---------- photo form ---------- */
function photoForm(pairId, id){
  const p = S.pairs[pairId]; const old = id ? S.items[id] : null;
  const st = {images: old ? clone(old.data.images || []) : []};
  const startFolder = old ? (old.folder || '') : (S.tab === 'photo' && S.photoFolder && S.photoFolder !== '_none' ? S.photoFolder : '');
  const groups = () => [...new Set(st.images.map(x => x.group).filter(Boolean))];
  openModal({title: old ? '사진 기록 수정' : '사진 올리기', wide:true, body:`
    <div class="row2">
      <div class="field"><label for="f-folder">폴더 (카테고리)</label><select id="f-folder">${folderOptions(p, startFolder)}</select>
        <input type="text" class="inp" id="f-newfolder" placeholder="새 폴더 이름" hidden></div>
      <div class="field"><label for="f-title">제목 (선택)</label><input type="text" id="f-title" placeholder="예: 생일 합작" value="${esc(old?.title || '')}"></div>
    </div>
    <div class="field"><span class="flabel">사진</span>
      <div class="drop" id="f-drop">사진을 여기에 끌어다 놓거나
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">
          <label class="btn small" for="f-files">${I.plus}사진 고르기</label>
          ${old ? '' : `<label class="btn small" for="f-dir">${I.folder}폴더째 올리기</label>`}
        </div>
        <input type="file" id="f-files" accept="image/*" multiple class="sr">
        ${old ? '' : '<input type="file" id="f-dir" class="sr" webkitdirectory multiple>'}
      </div>
      <div id="f-groups"></div>
      <div class="imgedit" id="f-imgs"></div></div>
    <div class="field"><label for="f-desc">설명</label><textarea id="f-desc" rows="3" placeholder="그린 사람, 출처, 그날의 이야기 등">${esc(old?.data?.desc || '')}</textarea></div>
    ${commonFields(old)}`,
    foot:`<button class="btn" data-m="cancel">취소</button><button class="btn primary" id="f-save">저장</button>`,
    onMount(root){
      const sel = $('#f-folder', root), nf = $('#f-newfolder', root);
      sel.addEventListener('change', () => { nf.hidden = sel.value !== '_new'; if (!nf.hidden) nf.focus(); });
      const list = $('#f-imgs', root);
      const sync = () => $$('.imgrow textarea', list).forEach((ta, i) => { st.images[i].caption = ta.value; });
      const drawGroups = () => {
        const g = groups(); const box = $('#f-groups', root);
        box.innerHTML = g.length > 1 && !old ? `<div class="grouplist" style="margin-top:8px">
          <label class="check-inline"><input type="checkbox" id="f-split" checked>하위 폴더마다 따로 분류해서 저장 (폴더 이름이 카테고리가 돼요)</label>
          ${g.map(n => `<div class="grouprow">${I.folder}<span class="gname">${esc(n)}</span><span class="mono hint">${st.images.filter(x => x.group === n).length}장</span></div>`).join('')}</div>` : '';
      };
      const draw = () => {
        list.innerHTML = st.images.map((x, i) => `<div class="imgrow"><img src="${esc(x.preview || imgSrc(x.ref))}" alt="">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${x.group && groups().length > 1 ? `<span class="hint">${I.folder} ${esc(x.group)}</span>` : ''}
          <textarea id="f-cap-${i}" placeholder="이 사진 설명 (선택)" style="width:100%">${esc(x.caption || '')}</textarea></div>
          <div class="ops"><button class="mini" data-op="up" data-i="${i}" title="위로">${I.arrowUp}</button><button class="mini" data-op="down" data-i="${i}" title="아래로">${I.arrowDown}</button><button class="mini" data-op="rm" data-i="${i}" title="빼기">${I.x}</button></div></div>`).join('');
        drawGroups();
      };
      list.addEventListener('click', e => {
        const b = e.target.closest('[data-op]'); if (!b) return; sync(); const i = +b.dataset.i;
        if (b.dataset.op === 'rm') st.images.splice(i, 1);
        if (b.dataset.op === 'up' && i > 0) [st.images[i-1], st.images[i]] = [st.images[i], st.images[i-1]];
        if (b.dataset.op === 'down' && i < st.images.length - 1) [st.images[i+1], st.images[i]] = [st.images[i], st.images[i+1]];
        draw();
      });
      const isImg = (f) => f.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name);
      const addFiles = (files, fromDir) => {
        sync();
        const imgs = files.filter(isImg).sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, 'ko', {numeric:true}));
        if (!imgs.length){ toast('사진 파일을 찾지 못했어요.'); return; }
        imgs.forEach(f => {
          let group = '';
          if (fromDir && f.webkitRelativePath){ const seg = f.webkitRelativePath.split('/'); group = seg.length >= 3 ? seg[1] : seg[0]; }
          st.images.push({file:f, preview:URL.createObjectURL(f), caption:'', group});
        });
        if (fromDir && !sel.value){
          const g = groups(); const rootName = (imgs[0].webkitRelativePath || '').split('/')[0];
          if (g.length <= 1 && rootName){ const ex = (p.folders || []).find(f => f.name === rootName); if (ex) sel.value = ex.id; else { sel.value = '_new'; nf.hidden = false; nf.value = rootName; } }
        }
        draw();
      };
      bindDrop($('#f-drop', root), $('#f-files', root), files => addFiles(files, false));
      const dir = $('#f-dir', root); if (dir) dir.addEventListener('change', () => { addFiles(Array.from(dir.files || []), true); dir.value = ''; });
      draw();
      $('[data-m=cancel]', root).onclick = () => closeModal();
      $('#f-save', root).onclick = async (ev) => {
        sync(); const btn = ev.currentTarget;
        if (!st.images.length && !$('#f-desc', root).value.trim()){ toast('사진을 한 장 이상 넣어 주세요.'); return; }
        if (sel.value === '_new' && !nf.value.trim()){ toast('새 폴더 이름을 적어 주세요.'); return; }
        try {
          const counter = {n:0, total:countPending(st.images)};
          setBusy(btn, '저장 중…'); await uploadPending(st.images, btn, counter);
          const common = readCommon(root); const desc = $('#f-desc', root).value; const title = $('#f-title', root).value.trim();
          const split = $('#f-split', root);
          if (split && split.checked){
            for (const g of groups()){
              const fid = await ensureFolder(pairId, g);
              const it = {...baseItem(pairId, 'photo', null), ...common, title: title || g, folder: fid, data:{desc, images: st.images.filter(x => x.group === g).map(x => ({ref:x.ref, caption:(x.caption || '').trim()}))}};
              await put('items', uid(), it);
            }
            const loose = st.images.filter(x => !x.group);
            if (loose.length) await put('items', uid(), {...baseItem(pairId, 'photo', null), ...common, title, folder:'', data:{desc, images: loose.map(x => ({ref:x.ref, caption:(x.caption || '').trim()}))}});
            closeModal(); toast(`폴더 ${groups().length}개로 나눠 저장했어요.`); return;
          }
          const folder = sel.value === '_new' ? await ensureFolder(pairId, nf.value) : sel.value;
          const it = {...baseItem(pairId, 'photo', old), ...common, title, folder,
            data:{desc, images: st.images.map(x => ({ref:x.ref, caption:(x.caption || '').trim()}))}};
          const removed = old ? [...collectRefs(old.data)].filter(r => !collectRefs(it.data).has(r)) : [];
          await put('items', id || uid(), it); dropAssets(removed); closeModal(); toast('사진을 저장했어요.');
        } catch(e){ setBusy(btn); toast(errText(e)); }
      };
    }});
}

/* ---------- tweet form ---------- */
function splitTweets(text){
  return String(text || '').replace(/\r/g, '').split(/\n[ \t]*-{3,}[ \t]*(?=\n|$)/).map(s => s.trim()).filter(Boolean);
}
function tweetForm(pairId, id){

    ? (old.data.tweets || []).map(t => ({text:t.text || '', reply:t.reply || '', quote:qText(t.quote), showR:!!t.reply, showQ:!!qText(t.quote), images:t.images || [], qImages:(t.quote && t.quote.images) || []}))

      sbox.addEventListener('input', e => { const el = e.target; if (el.dataset.k) st.sheets[+el.dataset.i][el.dataset.k] = el.value; });

      $('#f-addsheet', root).onclick = () => { st.sheets.push({label:'', url:''}); drawSheets(); };
      const drawTabs = () => {
        if (!st.loaded){ tbox.innerHTML = '<div class="hint">시트 내용을 불러오는 중…</div>'; return; }
        tbox.innerHTML = st.tabs.length ? `<div class="grouplist" style="margin-top:4px">${st.tabs.map((t, i) => `<div class="grouprow">${I.sheet}<input class="inp gname" id="f-tn-${i}" data-i="${i}" value="${esc(t.name)}" aria-label="시트 이름"><button type="button" class="mini" data-op="up" data-i="${i}" title="앞으로">${I.arrowUp}</button><button type="button" class="mini" data-op="rm" data-i="${i}" title="빼기">${I.x}</button></div>`).join('')}</div>

        const t = e.target.closest('[data-act=gs-tab]'); if (t){ e.stopPropagation(); GS_TAB._form = +t.dataset.i; drawTabs(); return; }
        const b = e.target.closest('[data-op]'); if (!b) return; const i = +b.dataset.i;

        if (b.dataset.op === 'up' && i > 0) [st.tabs[i-1], st.tabs[i]] = [st.tabs[i], st.tabs[i-1]];
        drawTabs();
      });
      const addTabs = (tabs) => { const good = tabs.filter(t => t.html); if (!good.length){ toast('표를 찾지 못했어요. 시트에서 칸을 선택해 복사해 주세요.'); return; } st.tabs.push(...good); GS_TAB._form = st.tabs.length - good.length; drawTabs(); toast(`시트 ${good.length}개를 가져왔어요.`); };

        e.preventDefault(); const cd = e.clipboardData; if (!cd) return;

        const f = files[0]; if (!f) return;
        try { $('#f-drop', root).classList.add('over'); addTabs(await fileToTabs(f)); }

        finally { $('#f-drop', root).classList.remove('over'); }
      });
      drawSheets(); drawTabs();
      if (old){
        const load = async () => { const raw = (old.data.parts || 1) > 1 ? await fullBody(id) : old.data.body; st.tabs = gsTabsOf(old, raw || '[]') || []; st.loaded = true; drawTabs(); };

      $('[data-m=cancel]', root).onclick = () => closeModal();
      $('#f-save', root).onclick = async (ev) => {
        const btn = ev.currentTarget; if (!st.loaded) return;
        const sheets = st.sheets.map(s => ({label:(s.label || '').trim(), url:(s.url || '').trim()})).filter(s => s.url);
        if (sheets.some(s => !/^https?:\/\//.test(s.url))){ toast('시트 링크는 https://로 시작해야 해요.'); return; }
        if (!st.tabs.length && !sheets.length){ toast('시트 내용을 붙여 넣거나 링크를 넣어 주세요.'); return; }
        try {
          setBusy(btn, '저장 중…');
          const nid = id || uid();
          const b = await putBody(nid, JSON.stringify(st.tabs.map(t => ({name:(t.name || '').trim(), html:t.html}))), old?.data?.parts || 1);
          await put('items', nid, {...baseItem(pairId, 'check', old), ...readCommon(root), title: $('#f-title', root).value.trim(),
            data:{desc: $('#f-desc', root).value, sheets, body:b.body, parts:b.parts}});
          closeModal(); toast('체크리스트를 저장했어요.');
        } catch(e){ setBusy(btn); toast(errText(e)); }
      };
    }});
}

async function deletePair(id){
  const p = S.pairs[id]; const its = itemsOf(id);
  const ok = await confirmBox(`'${pairTitle(p)}' 페어와 기록 ${its.length}개를 모두 지울까요?\n올린 사진과 PDF도 함께 지워지고 되돌릴 수 없어요. 먼저 설정에서 백업 파일을 받아 두면 안전해요.`, '모두 삭제');
  if (!ok) return;
  closeModal();
  try {
    const refs = new Set(); collectRefs(p, refs);
    for (const it of its){ collectRefs(it.data, refs); await del('items', it.id); for (let k = 1; k < ((it.data || {}).parts || 1); k++) { try { await del('bodies', `${it.id}_${k}`); } catch(e){} } }
    await del('pairs', id); dropAssets([...refs]);
    go({view:'home'}); toast('페어를 지웠어요.');
  } catch(e){}
}

/* ---------- reader ---------- */
const RD_DEFAULT = {font:'', size:17, lh:1.9, width:'normal', paper:'default', indent:false, gap:'loose'};
const RD_W = {narrow:'30em', normal:'36em', wide:'44em'};
function rdPrefs(){ try { return {...RD_DEFAULT, ...JSON.parse(localStorage.getItem('jk-reader') || '{}')}; } catch(e){ return {...RD_DEFAULT}; } }
function rdSave(p){ try { localStorage.setItem('jk-reader', JSON.stringify(p)); } catch(e){} }
function readerParas(body){
  return String(body || '').split('\n').map(l => {
    const t = l.trim();
    if (!t) return '<p class="gap"></p>';
    if (isSceneLine(t)) return '<p class="scene">* * *</p>';
    return `<p class="${/^["“'‘「『\-–—(]/.test(t) ? 'dl' : ''}">${esc(t)}</p>`;
  }).join('');
}
let RD = null;
function closeReader(){
  if (!RD) return;
  RD = null; $('#rd-root').innerHTML = ''; document.documentElement.style.overflow = '';
  schedule();
}
async function openReader(id){
  const it = S.items[id]; if (!it) return; const p = S.pairs[it.pairId]; const th = themeOf(p);
  const pr = rdPrefs(); RD = {id, pr};

  const fontCss = () => pr.font ? (FONTS[pr.font] || FONTS.plex).css : fontCssOf(th.font, th, p);
  const vars = () => `--rw:${RD_W[pr.width] || RD_W.normal};--rfs:${pr.size}px;--lh:${pr.lh};--pgap:${pr.gap === 'tight' ? '.15em' : '.85em'}`;
  const seg = (key, opts) => `<div class="seg" data-key="${key}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${String(pr[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`;

  $('#rd-root').innerHTML = `<div class="rd-layer paper-${pr.paper}" id="rd-layer" role="dialog" aria-modal="true" aria-label="${esc(it.title || '글 읽기')}" style="${vars()}">

      ${S.canWrite ? `<button id="rd-edit" title="수정" aria-label="수정">${I.edit}</button>` : ''}

        <div class="rmeta">${[d.author, fmtDate(itemDate(it)), n.toLocaleString() + '자', '약 ' + readMinutes(n) + '분'].filter(Boolean).map(esc).join(' · ')}</div>

  let saveT;
  const onScroll = () => {
    const max = sc.scrollHeight - sc.clientHeight; const r = max > 0 ? sc.scrollTop / max : 1;
    $('#rd-pbar').style.width = (r * 100).toFixed(1) + '%';
    clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('jk-read:' + id, r.toFixed(4)); } catch(e){} }, 300);

/* ---------- lightbox ---------- */
function openLB(setKey, i, meta){
  const set = LB_SETS[setKey]; if (!set) return;
  const st = {i};
  const draw = () => {
    const x = set[st.i];
    $('#lb-root').innerHTML = `<div class="lb" role="dialog" aria-modal="true" aria-label="사진 보기">
      <div class="lb-top"><span>${st.i + 1} / ${set.length}</span><button id="lb-x" aria-label="닫기">${I.x}</button></div>
      <div class="lb-stage">${set.length > 1 ? `<button class="lb-nav" id="lb-p" aria-label="이전">${I.left}</button>` : ''}<img src="${esc(imgSrc(x.ref))}" alt="${esc(x.caption || '')}">${set.length > 1 ? `<button class="lb-nav" id="lb-n" aria-label="다음">${I.right}</button>` : ''}</div>
      ${x.caption || (meta && (meta.title || meta.desc)) || x.title ? `<div class="lb-cap">${(meta && meta.title) || x.title ? `<div class="t">${esc((meta && meta.title) || x.title)}</div>` : ''}${x.caption ? esc(x.caption) : (meta && meta.desc ? esc(meta.desc) : '')}</div>` : ''}
    </div>`;
    $('#lb-x').onclick = closeLB;
    const pv = $('#lb-p'), nx = $('#lb-n');
    if (pv) pv.onclick = () => { st.i = (st.i - 1 + set.length) % set.length; draw(); };
    if (nx) nx.onclick = () => { st.i = (st.i + 1) % set.length; draw(); };

const EXT = {'image/png':'png','image/jpeg':'jpg','image/gif':'gif','image/webp':'webp','application/pdf':'pdf','image/svg+xml':'svg'};
async function exportZip(btn, status){
  setBusy(btn, '준비 중…');

    await loadScript(LIB.zip);
    const zip = new window.JSZip();
    let bodies = S.bodies;

    const data = {app:'jakeop-archive', version:2, exportedAt:new Date().toISOString(), site:S.site, pairs:S.pairs, items:S.items, bodies};
    const refs = [...collectRefs({p:S.pairs, i:S.items, s:S.site})];
    let n = 0, miss = 0; const files = {};
    for (const r of refs){
      n++; status.textContent = `사진과 파일 모으는 중 ${n}/${refs.length}`;
      try { let b = await localBlob(r); if (!b){ const res = await fetch('/_blob/' + r); if (!res.ok) throw 0; b = await res.blob(); } const name = `${r}.${EXT[b.type] || 'bin'}`; zip.file('assets/' + name, b); files[r] = name; } catch(e){ miss++; }
    }

    status.textContent = '압축하는 중…';
    const blob = await zip.generateAsync({type:'blob'});
    status.textContent = miss ? `파일 ${miss}개는 찾지 못해 빠졌어요.` : '';
    setBusy(btn);
    await saveFile(`${S.site.title || 'Pair Archive'} 백업 ${todayStr()}.zip`, blob);
  } catch(e){ setBusy(btn); status.textContent = '백업 파일을 만들지 못했어요. 잠시 후 다시 시도해 주세요.'; }
}
async function importBackup(file, status){
  try {
    let data, zip = null;
    if (/\.json$/i.test(file.name) || file.type === 'application/json') data = JSON.parse(await file.text());
    else { await loadScript(LIB.zip); zip = await window.JSZip.loadAsync(file); data = JSON.parse(await zip.file('data.json').async('string')); }
    if (!data || !data.pairs) throw new Error('bad');
    const np = Object.keys(data.pairs).length, ni = Object.keys(data.items || {}).length;
    const ok = await confirmBox(`백업 파일에서 페어 ${np}개, 기록 ${ni}개를 되살릴까요?\n같은 기록이 이미 있으면 백업 파일 내용으로 덮어써요.`, '되살리기', false);
    if (!ok) return;
    const map = {};
    const refs = [...collectRefs({p:data.pairs, i:data.items, s:data.site || {}})];
    let n = 0;
    for (const r of refs){
      n++; status.textContent = `사진 올리는 중 ${n}/${refs.length}`;
      const fname = data.files && data.files[r]; const zf = zip && fname ? zip.file('assets/' + fname) : null;
      if (!zf){ map[r] = r; continue; }
      const ext = fname.split('.').pop(); const type = Object.keys(EXT).find(k => EXT[k] === ext) || 'image/jpeg';
      const blob = new Blob([await zf.async('arraybuffer')], {type});
      try { map[r] = await uploadFile(new File([blob], fname, {type})); } catch(e){ map[r] = ''; }
    }
    const fix = (o) => mapRefs(o, v => (v && map[v] !== undefined) ? map[v] : v);
    status.textContent = '기록 저장하는 중…';
    if (data.site && data.site.title) await put('site', 'main', fix({title:data.site.title, sub:data.site.sub || '', me:data.site.me || {name:'', handle:'', avatar:''}}));
    for (const [bid, b] of Object.entries(data.bodies || {})) await put('bodies', bid, b);
    for (const [id, p] of Object.entries(data.pairs)) await put('pairs', id, fix(p));
    let k = 0; for (const [id, it] of Object.entries(data.items || {})){ k++; if (k % 10 === 0) status.textContent = `기록 저장하는 중 ${k}/${ni}`; await put('items', id, fix(it)); }
    status.textContent = ''; toast(`페어 ${np}개, 기록 ${ni}개를 되살렸어요.`);
  } catch(e){ status.textContent = '이 파일은 Pair Archive 백업 파일이 아니거나 손상됐어요.'; }
}
